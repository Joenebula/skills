# Rebuild the skills map whenever the library changes.
#
# The map is a build artifact: map/skills-map.html is generated from map/skills-data.js (the
# editorial notes) plus the library itself (what actually exists). Nothing reads the library
# at page-load time — a web page cannot open a disk it is not on — so a skill added here only
# appears on the map once this has run.
#
# This used to live in another repo and needed a fine-grained token to read this one. Now the
# map lives in the library, so the job checks out one repo, has no secret to configure, and
# cannot be broken by a token expiring.

name: Rebuild skills map

on:
  push:
    paths:
      - 'skills/**'
      - 'agents/**'
      - 'map/skills-data.js'
      - 'map/shell.html'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

# A second push while this is running would race the first to commit the same file.
concurrency:
  group: rebuild-map
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the whole history: every "added" date on the map comes from it, and a shallow
          # clone would silently date every skill to the day CI first ran
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Rebuild
        run: node scripts/build-map.mjs

      - name: Commit if it changed
        run: |
          if git diff --quiet -- map/skills-map.html; then
            echo "No change — the library holds what the map already shows."
            exit 0
          fi
          git config user.name  "skills-map bot"
          git config user.email "noreply@github.com"
          # Stage the one generated file by name. G-001 is about a `git add -A` that swept up
          # more than it meant to; the rule stands here, in the repo it happened to.
          git add map/skills-map.html
          git commit -m "Rebuild the map from the library

          Generated by .github/workflows/rebuild-map.yml — the library changed, so the map
          did. Re-publishing it to the shared link is still a manual step."
          git push
