/* ------------------------------------------------------------------ layout */
function gutters(){
  const u=W/innerWidth, wide=innerWidth>820;
  // The right-hand side is one column or two: the controls always, and an open skill
  // beside them once there is room for it. Measure whichever reaches furthest left, or
  // node names get laid out underneath it.
  let edge=innerWidth;
  if(wide){
    edge=Math.min(edge,$('panel').getBoundingClientRect().left);
    // In the radial view an open skill takes a column of its own and the map
    // gives way to it. A board or a row cannot: its width is its layout, so giving way means
    // re-laying it out and clipping it, which is what made the chart disappear behind the
    // panel. There the panel simply floats over it.
    const d=$('detail');
    if(!FLAT() && d.classList.contains('on') && getComputedStyle(d).position==='fixed')
      edge=Math.min(edge,d.getBoundingClientRect().left);
  }
  SAFE_R = wide ? (edge-14)*u : W-8;
  /* And the left, which was the number 10 and had been since the left gutter held nothing but
     a trail canvas. It now holds the layout menu, the findings button and the build stamp —
     opaque cards, 186px of them — and the map was being laid out underneath.

     On the board that meant the first two columns were behind the menu and could not be
     panned out from under it: panning is clamped so the board's left edge cannot pass the
     left edge of the safe strip, and the strip started at 10. Two columns you could neither
     read nor reach.

     Measured, not assumed, and only while it is showing — below 980px the column is hidden
     and the whole width is the map's again. */
  // Nothing is in the top-left any more, so the left edge is the frame. It was measured
  // from a 186px column that no longer exists.
  SAFE_L = 8;
  /* And the bottom, now that the layout nav lives there. The flat views write their labels
     along their own floor; without this the nav would sit on top of them, which is the same
     mistake the left column made at the other edge and worth not making twice. */
  const nb=$('bar');
  SAFE_B = (nb && getComputedStyle(nb).display!=='none')
    ? (innerHeight-nb.getBoundingClientRect().top+8)*u : 8*u;
  // The flat views are clipped to this strip, and the strip narrows when a skill panel
  // opens beside the controls. Nothing re-ran the clip when the panel closed again, so the
  // board stayed cropped to the narrower strip and a slice of it was simply missing until
  // something else happened to redraw. The clip follows the strip both ways now.
  if(typeof clipFlat==='function' && FLAT()){ clipFlat(); panX=clampPanX(panX); applyView(); }
}
/* ---- views -----------------------------------------------------------------------------
   Four arrangements of the same nodes. A view only ever decides where a node's home is and
   what scaffolding sits behind it — nothing else in the map knows which one is showing, so
   selection, search, picks, labels and the panel all work the same in all four.

   Transitions are free: the physics already springs every node toward its home, so moving
   the homes and waking the field animates from one layout to the next. */
let VIEW='radial', AX=500, AY=370, SCAF=[], FLATX=[0,1000], FLATY=[0,740], FLATROW=[0,740], COLGAP=16, HUB={};
// the two layouts that are laid out along one axis and centred on the other
const FLAT=()=>VIEW==='board'||VIEW==='flow';
/* Zoom in a flat view is bounded at both ends, and the bounds come from the layout rather
   than from a number someone picked.

   The ceiling is the zoom at which the layout is exactly as tall as the window. Past it the
   columns — or the arcs, and the labels under the row — start going off the top and bottom,
   and since these views do not pan vertically, whatever leaves is simply gone. That is the
   "you cannot see the nodes" problem: it is not that the zoom is large, it is that the
   layout is taller than the frame and nothing can bring the rest back.

   The floor is the zoom that fits the whole width, so the far end of the board is one
   gesture away rather than unreachable. */
const FRAMEZ=2.2;                    // enough that a 13px name reads as a 29px one
// At rest the whole layout has to fit, arcs included. Framing one node is a different
// question: there the arcs are context and the row is the content, so the band that must stay
// on screen is the nodes and their names. Without this the arc could barely zoom at all — its
// ceiling was 1.3x, because the tallest arc is most of its height.
const flatBand=()=>(sel && FLAT() ? FLATROW : FLATY);
function zoomLimits(){
  const wAvail=SAFE_R-SAFE_L, hAvail=H;
  const lo=Math.min(1, wAvail/Math.max(1,FLATX[1]-FLATX[0]));
  const band = flatBand();
  const hi=Math.max(lo, hAvail/Math.max(1,band[1]-band[0]));
  return [lo,hi];
}
const clampZoom=z=>{ if(!FLAT()) return z;
  const [lo,hi]=zoomLimits(); return Math.max(lo,Math.min(hi,z)); };
/* Vertical pan is locked, so the zoom has to keep the layout centred by itself — and it has
   to centre the SAME band the ceiling was raised for. It did not. The ceiling used FLATROW
   when a node was selected, on the argument that the arcs are context and the row is the
   content; the centring went on using FLATY, arcs included. So the arc zoomed to 2.2x — a
   height the row could take and the whole fan could not — and then centred the fan, which
   put the row 30 units below the bottom of the frame. Zoom in, everything gone. One band,
   both decisions. */
const centreY=z=>{ const b=flatBand(); return CY-((b[0]+b[1])/2)*z; };

/* The board is wider than the frame on purpose, so it can be dragged sideways — but not so
   far that it leaves. Either end may be pulled to the middle of the visible area and no
   further, which is enough to read the last column and not enough to lose the thing. */
// The zoom it is clamping FOR, which is not always the zoom in force. Framing a selection
// computes the pan for the zoom it is about to animate to, and this was bounding it against
// the zoom it was animating from — so the selected node came to rest under the right-hand
// panel instead of in the middle.
function clampPanX(px,z){
  if(!FLAT()) return px;
  const zz=z||zoom;
  // Pan until an edge of the board meets the matching edge of the visible strip and no
  // further. Allowing the midpoint to reach either edge, as this first did, let the whole
  // board be dragged into the half of the screen you cannot see.
  const lo=SAFE_R-FLATX[1]*zz, hi=SAFE_L-FLATX[0]*zz;
  return lo>hi ? (lo+hi)/2 : Math.max(lo,Math.min(hi,px));
}
const VIEWS={
  radial:  {name:'Radial',      hint:'where it lives'},
  board:   {name:'Phase board', hint:"what it's for"},
  flow:    {name:'Flow',        hint:'where it all lands'}
};
const PHASE_ORDER=['always','A','B','C','D','E','F','G','H','S2','never','unmapped','builtin'];
const phaseRank=p=>{const i=PHASE_ORDER.indexOf(p); return i<0?99:i;};
/* "Phase A" is a filing reference, not a name — it says where something sits in a list and
   nothing about what it is. The heading is what the column is FOR, from GROUP_NAME in the
   data; where the build plan made the assignment its numbered step stays on the sub-line so
   BUILD-PLAN.md is still cross-referenceable, but it is not what you read first. */
const groupOf=n=>GROUP[n.id]||'setup';
function phaseTitle(p){
  if(GROUP_NAME[p]) return GROUP_NAME[p];
  const full=PHASES[p]||p, m=full.indexOf('·');
  if(m>0) return [full.slice(m+1).trim().toUpperCase(), full.slice(0,m).trim().toLowerCase()];
  return [full.toUpperCase(),''];
}

/* Order inside a column, and along the arc within a group.

   It was the order the data happened to be written in, which is not an order. The useful
   one is by what you would act on: a column stacks upward from a floor, so the first
   entries sit at the bottom where the eye lands, and that is where the work should be.

   Open items first — the six things with a fix waiting. Then unverified, the ones nobody
   has opened the file for. Then everything settled or already fine. Alphabetical inside
   each band so a column does not reshuffle for no reason.

   Agents deliberately do NOT sort first. They already read differently at a glance — the
   dotted collar is theirs alone — so spending the sort on them would buy a distinction the
   drawing already makes, at the cost of the one it does not. Swap the first line of rank()
   for `n.agent?0:1` if you would rather have them together. */
function rank(n){
  if(n.flag) return 0;                          // has an open fix
  if(EVIDENCE[n.id]==='named') return 1;        // nobody has looked at the file
  return 2;
}
const byRank=(a,b)=>rank(a)-rank(b)||a.id.localeCompare(b.id);

function homes(){
  SCAF=[];
  if(VIEW==='radial') return homesRadial();
  if(VIEW==='board') return homesBoard();
  return homesFlow();
}

/* ---- flow: everything on the left, where it lands on the right -------------------------
   The other four views answer "what is next to what". This one answers a different question
   and is the only one that states a total: of everything in the library, how much loads
   every session, how much the build plan actually places, how much it never mentions, and
   how much came with Claude Code. Four numbers, with every skill drawn travelling to the one
   it belongs to — so the thickness of each stream is the answer rather than a caption.

   Nothing here is new data. It is the ring each node already has, drawn as a destination
   instead of as a radius. What is new is that you can see the proportions, which a circle
   cannot show: on the radial view the outermost ring looks the biggest because it is the
   longest, when it is not. */
function homesFlow(){
  const rings=RINGS.filter(R=>N.some(n=>n.ring===R.key));
  // The hubs stop at 80% of the strip, not 92%: their names are set beside them and the last
  // 20% is what those names need. Pushed further right they ran under the panel and read
  // "Not in the..." — a view whose whole point is four labelled totals, with the labels cut.
  const W0=SAFE_R-SAFE_L;
  /* The hub sits wherever its own label ends at the right edge of the strip, not at a
     fraction of it. At 80% the names ran off the side on a narrow window — and this is a
     view whose entire subject is four labelled totals, so a label off the screen is the
     whole thing failing. The widest of the four decides for all of them. */
  const lblW=Math.max(...RINGS.map(R=>R.label.length))*4.6+16;
  const HUBX=Math.max(SAFE_L+W0*0.55, SAFE_R-lblW-14);
  const L=SAFE_L+54;
  const groups={}; N.forEach(n=>(groups[groupOf(n)]??=[]).push(n));
  Object.values(groups).forEach(g=>g.sort(byRank));
  const cols=GROUP_ORDER.filter(p=>groups[p]).concat(
    Object.keys(groups).filter(p=>!GROUP_ORDER.includes(p)));
  /* Half the run to the hubs is the field and half is the streams — until half is not
     enough. At 1200px that gave sixteen columns eleven units each, which is narrower than a
     name turned on its side, so every label touched its neighbour. The field takes what a
     legible column needs and the streams get the rest, up to a ceiling where the streams
     would stop being the point of the view. */
  const MINCW=15;
  const FIELD_R=Math.min(SAFE_L+(HUBX-SAFE_L)*0.72,
                Math.max(SAFE_L+(HUBX-SAFE_L)*0.50, SAFE_L+54+MINCW*cols.length));
  const cw=(FIELD_R-L)/Math.max(1,cols.length);
  /* The vertical names hang below the field, so the field itself stops well short of the
     floor — how short depends on the longest name, which is why it is measured rather than
     guessed at a percentage. Everything above that is the field's. */
  const HB=H-SAFE_B;
  const nameH=Math.max(...cols.map(p=>phaseTitle(p)[0].length))*6.6+26;
  const top=HB*0.04, bot=HB-nameH, span=Math.max(60,bot-top), midY=(top+bot)/2;
  /* Every column stacks on the same pitch and hangs from the middle, so a column of two is a
     short mark near the centre and a column of eleven reaches out from it — the height of a
     column is how much is in it.

     Stretching each column to the full height instead, which is what this did first, made
     every column the same length whatever it held, and put the first and last item of all
     seventeen on the same two lines: a dense row of dots across the top and another across
     the bottom, which is a grid artefact and not a fact about anything. */
  const tallest=Math.max(...cols.map(p=>groups[p].length));
  const HT=HB*0.82, HTOP=HB*0.09;          // the block the four destinations occupy
  const pitch=Math.min(24,span/Math.max(8,tallest));
  COLGAP=pitch;                            // node radii are derived from it
  cols.forEach((p,ci)=>{
    const list=groups[p], x=L+cw*(ci+0.5);
    // Two lanes inside a column rather than one: eleven dots on a single vertical is a line,
    // not a distribution. The lane comes from the index so the stagger is stable.
    list.forEach((n,i)=>{
      n.hx=x+((i%2)?1:-1)*Math.min(cw*0.26,5.5);
      n.hy=midY+(i-(list.length-1)/2)*pitch;
    });
    const half=(list.length-1)/2*pitch;
    // Columns with no sector colour of their own fell back to --ink3, which on this ground
    // is a whisper: eight of the seventeen names were effectively unreadable while the
    // coloured ones were fine. Fall back to the body ink instead — grey still says "no
    // colour of its own", and it can be read while saying it.
    SCAF.push({t:'lane',key:p,x,top:midY-half-11,bot:midY+half+11,base:0,row:0,
               label:phaseTitle(p)[0],n:list.length,col:SECTOR[p]||cv('--ink2')});
  });
  /* The names sit under the deepest column, not under the field's nominal floor, which after
     the columns were centred was a long way below anything drawn.

     Three rows, first-fit by x. Width is estimated from the character count rather than
     measured, because nothing is in the document yet — an over-estimate costs a row and an
     under-estimate costs a collision, so it errs wide. A name with room on none of the three
     is dropped rather than printed through its neighbour: the tick and the colour still say
     which column it is, and a smear says nothing. */
  const deepest=midY+(tallest-1)/2*pitch;
  /* The names run along the bottom of the whole strip, not along the bottom of the field.
     Under the field there is room for about eight of the seventeen and the rest were being
     dropped; across the full width, on three rows, they all fit. They stay in column order,
     so the leader from each column to its name fans out and never crosses another.

     Width is estimated from the character count rather than measured, because nothing is in
     the document yet — an over-estimate costs a row and an under-estimate costs a collision,
     so it errs wide. */
  const lanes=SCAF.filter(x=>x.t==='lane');
  lanes.forEach(x=>{ x.base=deepest+22; });
  // The destinations are spaced by share, not evenly: a ring holding a third of the library
  // is given a third of the height, so the gaps between the hubs ARE the proportions and the
  // streams arrive at the angle their size earns.
  let acc=0;
  rings.forEach(R=>{
    const nR=N.filter(n=>n.ring===R.key).length;
    const h=HT*(nR/N.length);
    // The dot is a destination marker, not a bar: the count beside it carries the quantity
    // already, so it only has to be big enough to see the streams land on it.
    SCAF.push({t:'hub',key:R.key,x:HUBX,y:HTOP+acc+h/2,n:nR,label:R.label,col:cv(R.col),
               r:Math.max(2.4,Math.sqrt(nR)*0.82)});
    acc+=h;
  });
  HUB={}; SCAF.filter(s=>s.t==='hub').forEach(s=>HUB[s.key]={x:s.x,y:s.y});
  // Everything in this view flows from the agreement, so it sits at the head of the field
  // rather than off the edge of it.
  /* The agreement sits at the head of the field. Its name is set centred underneath it and
     is wider than the marker, so putting it hard against the left edge pushed the name off
     the strip. Half a name's width of clearance, measured from the name. */
  AX=SAFE_L+Math.max(30, ANCHOR.id.length*3.6+10); AY=(top+bot)/2;
  FLATX=[SAFE_L+4,SAFE_R-4];
  // top of the tallest column and the hub block, down past the rotated names under the field
  // the top of the tallest column or the hub block, down to the last of the three name rows
  // the top of the tallest column or the hub block, down past the vertical names
  FLATY=[Math.min(midY-(tallest-1)/2*pitch, HTOP)-20,
         deepest+22+Math.max(...lanes.map(x=>x.label.length))*6.6+10];
  FLATROW=FLATY;
}

function homesRadial(){
  AX=CX; AY=CY;
  N.forEach(n=>{ n.R=n.F*MAXR;
    if(n.jit===undefined) n.jit=1;   // the band already spreads the radius
    n.hx=CX+Math.cos(n.A)*n.R*n.jit; n.hy=CY+Math.sin(n.A)*n.R*n.jit; });
}

/* Overlap pulls, everything else pushes, and the result is scaled to fill the frame. The
   scaling matters: without it the answer depends on how well the force constants happen to
   suit this particular node count, which is not something worth tuning by hand. */
/* A column per phase, stacked from a common floor — a taller column is more work waiting
   in that phase, which is the only thing this view is for. Centring the nodes in each
   column would put the tallest and the shortest at the same eye level and lose it. */
function homesBoard(){
  const groups={}; N.forEach(n=>(groups[groupOf(n)]??=[]).push(n));
  Object.values(groups).forEach(g=>g.sort(byRank));
  const cols=GROUP_ORDER.filter(p=>groups[p]).concat(
    Object.keys(groups).filter(p=>!GROUP_ORDER.includes(p)));
  // Seventeen named columns do not fit 640 units at any size worth reading, so the board is
  // as wide as it needs to be and pans sideways — which is how you read a board anyway. It
  // starts at the left because the columns are in order. panBounds() stops it being dragged
  // off the screen entirely.
  const n=cols.length+1;                    // +1 for the agreement, which governs rather than fires
  // 30% narrower than they were. A column only has to hold three dots and a heading, and at
  // 78 units it was holding a lot of empty space either side of both — which also meant more
  // of the board was off the frame than needed to be.
  /* 55 was the floor and also, in practice, the answer: eighteen columns never divided the
     strip into anything wider, so the board was always wider than the frame and always
     panned, even on a screen with room for it. 40 is the narrowest a column can be and still
     hold two dots and a heading, so it fits where it fits and pans where it does not. */
  const cw=Math.max(40,(SAFE_R-32-SAFE_L)/n);
  const L=SAFE_L+16;
  FLATX=[L,L+cw*n];
  const per=Math.min(3,Math.max(1,Math.round((cw-8)/15)));
  COLGAP=Math.min(22,(cw-10)/per);          // the dots have to fit the narrower column
  const tallest=Math.max(...cols.map(p=>Math.ceil(groups[p].length/per)));
  /* The cap was 34, which is a sensible row height and a poor use of a screen: the tallest
     column holds seven, so the board drew 200 units of content in a 600-unit frame and left
     two thirds of it empty. It now takes the height it is given, with a cap only loose
     enough to stop three nodes being flung to the corners. */
  const rowH=Math.min(78,(H-SAFE_B-150)/Math.max(1,tallest-1));
  const contentH=(tallest-1)*rowH;
  const base=Math.round((H-SAFE_B+contentH)/2)+12, top=base-contentH;
  FLATY=[top-34,base+38];                 // the heading block down to the tally under it
  FLATROW=FLATY;                          // a board is all content; there is no context to drop
  // the agreement gets a column of its own: it governs the phases, it is not one of them
  AX=L+cw/2; AY=base-6;
  SCAF.push({t:'col',key:'agreement',x:L,w:cw,title:['Agreement','governs all'],n:1,
             col:cv('--amber'),top:base,base,headTop:top});
  cols.forEach((p,ci)=>{
    const list=groups[p], x=L+cw*(ci+1), mid=x+cw/2;
    // Each box is the height of what it holds. Drawing every column to the tallest one's
    // height made a column of two look like a column of eleven with nine missing.
    const colTop=base-Math.max(0,Math.ceil(list.length/per)-1)*rowH;
    SCAF.push({t:'col',key:p,x,w:cw,title:phaseTitle(p),n:list.length,
               col:SECTOR[p]||cv('--ink3'),top:colTop,base,headTop:top});
    list.forEach((n,i)=>{
      const row=Math.floor(i/per), inRow=i%per;
      const rowN=Math.min(per,list.length-row*per);
      n.hx=mid+(inRow-(rowN-1)/2)*COLGAP; n.hy=base-row*rowH;
    });
  });
}

function setLayout(v){
  if(v===VIEW) return;
  VIEW=v;
  /* A search does not survive the chart it was made in. Its results list is positions in a
     layout that has just been replaced, and a typed query left in the box quietly hides most
     of the new chart — you switch to the arc to see how tangled it is and get four nodes,
     with the reason sitting in a search box at the top of a panel you are not looking at.

     Picks are left alone on purpose. "Show me the agents" is a question about the skills, and
     it is the same question in every layout; a typed search is a question about this one. */
  if(query) clearFilter();
  document.querySelectorAll('#viewmenu button').forEach(b=>
    b.classList.toggle('on',b.dataset.v===v));
  svg.classList.toggle('freeform',v!=='radial');
  svg.classList.toggle('flatcore',FLAT());
  $('hint').textContent = FLAT()
    ? 'scroll or drag to move sideways · +/\u2212 to zoom · click a node for its links · esc to clear'
    : 'scroll to zoom · drag to pan · click a node for its links · esc to clear · / to search';
  homes(); rings(); deco(true); clipFlat();   // the one place the backdrop animates
  select(null);
  resetView();
  if(FLAT()){
    zoom=clampZoom(1); updateZoomLabel();
    panY=centreY(zoom);
    panX=clampPanX(v==='board' ? SAFE_L-FLATX[0]*zoom+8 : (SAFE_L+SAFE_R)/2-(FLATX[0]+FLATX[1])/2*zoom);
    applyView();
  }
  reheat(1);                      // the springs carry every node to its new home
  apply(); kick();
}

function resize(){
  W=1000; H=Math.round(1000*innerHeight/innerWidth); CY=H/2;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  // map units per CSS pixel — every node name is 13px on screen whatever the width
  const u=W/innerWidth;
  LBLU=13*u; LBLH=LBLU*1.55; LBLOFF=52*u;
  // how far a name stands off its dot before the leader line takes over
  LBLSTAND=9*u;
  svg.style.setProperty('--lbl',LBLU.toFixed(3)+'px');
  svg.style.setProperty('--lblhalo',(3.4*u).toFixed(3)+'px');
  // Column headings, sub-lines and tick labels in screen pixels too, so they stay the same
  // size as everything else on the page whatever the window is doing.
  svg.style.setProperty('--col',(11*u).toFixed(3)+'px');
  svg.style.setProperty('--colsub',(10*u).toFixed(3)+'px');
  // The flow view's own type, in the same screen pixels. Set as a fixed world size it came
  // out at twice the node names on a wide window — legible, and shouting.
  svg.style.setProperty('--lane',(12.5*u).toFixed(3)+'px');
  svg.style.setProperty('--hubn',(15*u).toFixed(3)+'px');
  svg.style.setProperty('--hubl',(10*u).toFixed(3)+'px');
  trailFit();
  gutters();
  // centre and size the map in the space the panel leaves, so no node ever sits under it
  CX=(SAFE_L+SAFE_R)/2;
  MAXR=Math.max(90, Math.min((SAFE_R-SAFE_L)/2, CY) - Math.min(60,Math.min(W,H)*.09));
  homes(); clipFlat();
  sizeNodes();
  orbitHomes();
  svg.classList.toggle('orbiting',orbiting);
  if(orbiting) orbitPlace();
  else if(!N[0].x) N.forEach(n=>{ n.x=n.hx; n.y=n.hy; });
  deco(); rings();
  if(orbiting){ alpha=0; if(!raf) raf=requestAnimationFrame(tick); } else { alpha=0; paint(); }
}

// Node radius is derived from the arc each ring gives one node, so the map stays legible
// whether it holds 56 skills or several hundred. NODE_SC feeds back into the repulsion,
// otherwise a dense map would push its own nodes off their rings.
let NODE_SC=1;
function sizeNodes(){
  const per={}; N.forEach(n=>per[n.ring]=(per[n.ring]||0)+1);
  let smallest=Infinity;
  N.forEach(n=>{
    const arcPer=2*Math.PI*n.R/Math.max(8,per[n.ring]);
    // Drawn smaller than it is pressable: the hit disc below is a separate transparent
    // circle of 7 units, so shrinking this costs nothing in aim.
    const base=Math.max(1.05,Math.min(2.3,arcPer*0.195));
    smallest=Math.min(smallest,base);
    n.rad=base*(0.80+n.w*0.06);
  });
  NODE_SC=smallest/3.1;
  // The radius is derived from the arc a ring gives one node, which says nothing about a
  // column. In the board a node has COLGAP to itself, and what has to fit inside it is the
  // outermost circle — the agent collar at twice the radius, or the ring at 1.45 times it.
  if(VIEW==='board') N.forEach(n=>{
    n.rad=Math.min(n.rad, Math.max(1.05, (COLGAP/2-0.8)/(n.agent?1.55:1.26)));
  });
  N.forEach((n,i)=>{
    const el=nodeEl[i];
    // The rings scale with the node instead of clearing it by a fixed distance. A fixed
    // 3.2 units around a 2-unit dot is a ring nearly twice the width of the thing it is
    // marking, which reads as a circle with a dot loose inside it. Proportional keeps the
    // relationship the same whatever size the node ends up, which matters because the board
    // caps its radii and the radial view does not.
    const f=el.querySelector('.flag'); if(f) f.setAttribute('r',(n.rad*1.48+0.26).toFixed(2));
    const tk=el.querySelector('.tick'); if(tk) tk.setAttribute('r',(n.rad*1.40+0.24).toFixed(2));
    el.querySelector('.ring').setAttribute('r',(n.rad*1.26+0.22).toFixed(2));
    el.querySelectorAll('.dot').forEach(d=>
      d.setAttribute('r',(d.classList.contains('collar')?n.rad*1.55+0.4:n.rad).toFixed(2)));
  });
}

/* ---- trails ---------------------------------------------------------------------------
   Three treatments, one picked at random each load, so the opening is not the same twice.
   All of it goes on a canvas behind the SVG: two hundred nodes shedding particles is
   thousands of elements a second, which SVG will not carry, and none of it is interactive
   so it has no business being in the document at all.

   One style, not three picked at random. It was three so the opening had some variety, but
   variety in the first three seconds is not a feature — it means the map you describe to
   someone is not the map they open.

   The one kept is the particles: each node sheds sparks as it travels, and they drift off
   the path and die where they fall. The other two were a tapering comet tail and a thin arc
   drawn along the node's own orbit. I kept the arc first and that was the wrong call — it
   draws the orbit, which is a line the map does not otherwise have and does not mean
   anything, where the particles only ever say "this was moving, and it went that way".

   Everything stops the moment the map is asked to sort itself out. The canvas is cleared
   and never drawn again, so nothing costs anything once you are past the opening. */
const tcv=document.createElement('canvas');
tcv.id='trailcv'; document.body.insertBefore(tcv,svg);
const tcx=tcv.getContext('2d');
let TW=0,TH=0,TDPR=1;
function trailFit(){
  TDPR=Math.min(2,devicePixelRatio||1);
  TW=innerWidth; TH=innerHeight;
  tcv.width=Math.round(TW*TDPR); tcv.height=Math.round(TH*TDPR);
  tcx.setTransform(TDPR,0,0,TDPR,0,0);
}

const sparks=[];
function trailStep(dt){
  for(const n of N){
    n._emit=(n._emit||0)-dt;
    if(n._emit<=0){
      n._emit=0.05+Math.random()*0.07;
      sparks.push({x:n.x,y:n.y,col:paintOf(n),life:1,sz:0.7+Math.random()*1.1,
        vx:(Math.random()-0.5)*7,vy:(Math.random()-0.5)*7});
    }
  }
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i]; s.life-=dt*1.15; s.x+=s.vx*dt; s.y+=s.vy*dt;
    if(s.life<=0) sparks.splice(i,1);
  }
}
function trailDraw(){
  if(!orbiting){ tcx.clearRect(0,0,TW,TH); return; }
  const sc=TW/W;                                  // map units to screen pixels
  tcx.clearRect(0,0,TW,TH);
  tcx.lineCap='round';
  for(const s of sparks){
    tcx.globalAlpha=s.life*s.life*0.62; tcx.fillStyle=s.col;
    tcx.beginPath(); tcx.arc(s.x*sc,s.y*sc,(0.5+s.life*s.sz*1.6),0,7); tcx.fill();
  }
  tcx.globalAlpha=1;
}

/* ------------------------------------------------------------------ physics */
let drag=null, alpha=1, raf=null;
// Physics is a 62-node luxury. Past a few hundred the repulsion overwhelms every spring
// and the map turns to mush, so both layouts are computed and the simulation stays off.
const SIMULATE=N.length<=200;
function sim(){
  const k=alpha, sc=MAXR/340;
  // Outside the radial view a node's home is the whole answer — the ring constraint and
  // the overlap springs would drag a column or a row back into a circle. Spring to home,
  // with just enough separation to stop two nodes sitting exactly on top of each other.
  if(VIEW!=='radial'){
    for(let i=0;i<N.length;i++){ const a=N[i];
      for(let j=i+1;j<N.length;j++){ const b=N[j];
        let dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy; if(d2<1)d2=1;
        if(d2<150){ const d=Math.sqrt(d2), f=26/d2; dx/=d; dy/=d;
          a.vx-=dx*f; a.vy-=dy*f; b.vx+=dx*f; b.vy+=dy*f; } } }
    N.forEach(n=>{ n.vx+=(n.hx-n.x)*.075; n.vy+=(n.hy-n.y)*.075;
      n.vx*=.72; n.vy*=.72;
      if(n!==drag){ n.x+=n.vx*k; n.y+=n.vy*k; } });
    return;
  }
  for(let i=0;i<N.length;i++){ const a=N[i];
    for(let j=i+1;j<N.length;j++){ const b=N[j];
      let dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy; if(d2<1)d2=1;
      if(d2<14000*sc*sc*NODE_SC){ const d=Math.sqrt(d2), f=520*sc*NODE_SC/d2; dx/=d; dy/=d;
        a.vx-=dx*f; a.vy-=dy*f; b.vx+=dx*f; b.vy+=dy*f; } } }
  N.forEach(n=>{
    let dx=n.x-CX, dy=n.y-CY, d=Math.hypot(dx,dy)||1;
    n.vx+=dx/d*(n.R-d)*.075; n.vy+=dy/d*(n.R-d)*.075;
    const hx=CX+Math.cos(n.A)*n.R, hy=CY+Math.sin(n.A)*n.R;
    n.vx+=(hx-n.x)*.010; n.vy+=(hy-n.y)*.010;
  });
  EDGES.forEach(e=>{ if(e.kind!=='overlap')return;
    const a=N[IDX[e.a]], b=N[IDX[e.b]];
    let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1;
    const f=(d-92*sc)/d*.012; a.vx+=dx*f; a.vy+=dy*f; b.vx-=dx*f; b.vy-=dy*f; });
  N.forEach(n=>{ n.vx*=.79; n.vy*=.79;
    if(n!==drag){ n.x+=n.vx*k; n.y+=n.vy*k; }
    n.x=Math.max(14,Math.min(W-14,n.x)); n.y=Math.max(14,Math.min(H-14,n.y));
  });
}

/* every shown label is pushed clear of its neighbours, with a leader when it moves */
// Row pitch and the width estimate are both in map units, so they have to track the label
// size — pinning names to 13px on screen changes how many units of the map they occupy.
let LBLH=11.6, LBLU=8.5, LBLOFF=40, LBLSTAND=8;
const DEAD=24;              // the deadband that stops labels flip-flopping across the gutter
let easing=false;
const EASE=.26;
const LBLBOX=[];
function paintMask(){
  while(lblMask.childNodes.length>1) lblMask.removeChild(lblMask.lastChild);
  const pad=LBLH*0.26/zoom;
  for(const b of LBLBOX)
    lblMask.appendChild(mk('rect',{x:(b.x0-pad).toFixed(1),y:(b.y0-pad).toFixed(1),
      width:(b.x1-b.x0+pad*2).toFixed(1),height:(b.y1-b.y0+pad*2).toFixed(1),
      rx:(pad*1.4).toFixed(1),fill:'#000'}));
}
function dodge(){
  easing=false; LBLBOX.length=0;
  const items=[];
  N.forEach((n,i)=>{
    const el=labelEl[i], LT=el._t, LD=el._ld;
    if(nodeEl[i].style.display==='none'||!el.classList.contains('show')){
      // retract to the node so the next reveal animates outward from it
      if(n._ldy===undefined) n._ldy=0;
      if(Math.abs(n._ldy)>.4){ n._ldy+=(0-n._ldy)*EASE; easing=true;
        LT.setAttribute('y',(n._ldy+3).toFixed(1)); }
      // _lead was set to 0 here and never set to anything else, so this ran once per node
      // for the life of the page. A label that showed, drew a leader, then hid again left
      // that leader on screen for good — a line from a node to a name that is no longer
      // there. Those are the random lines. Clear it every time.
      LD.style.opacity=0; return; }
    const est=(n.id.length+(NEWTAG.has(n.id)?2:0))*LBLU*.635+LBLU*.94;   // text width in map units, from the label size
    // Side is sticky: a node drifting a pixel across the gutter must not swap the label
    // back and forth every frame. Only commit once it is clearly past the threshold.
    const sx=n.sx, sy=n.sy, srad=n.srad;
    const rEdge=sx+srad+8+est, lEdge=sx-srad-8-est;
    const left = sx<CX ? (lEdge > (n._left===false ? SAFE_L+DEAD : SAFE_L))
                       : (rEdge > (n._left===true  ? SAFE_R-DEAD : SAFE_R));
    n._left=left;
    // A bigger standoff is what buys the room: the labels were starting 8 units from the
    // dot, so a row of three nodes 15 units apart had its three names overlapping before
    // the dodge had anywhere to put them. Further out, and the leader line says which name
    // belongs to which dot.
    const ax = left ? -(srad+LBLSTAND) : (srad+LBLSTAND);
    const x0 = left ? sx+ax-est : sx+ax;
    items.push({n,el,left,ax,x0,x1:x0+est,ty:sy});
  });
  // one sweep over every label, both columns at once — a left-anchored label from the
  // right half can still land on top of a right-anchored one, which per-side misses
  items.sort((a,b)=>a.ty-b.ty);
  // The pitch is what the map can afford, not the tightest that fits. Twelve names on an
  // empty board were being stacked at 14 units in the middle of 600 units of nothing.
  const PITCH=Math.max(LBLH, Math.min(LBLH*2.0,(H-70)/Math.max(1,items.length)));
  /* How far a name may travel from its own dot before it is withdrawn instead. The cap
     exists because a name a long way from its node stops belonging to it — but it was a
     fixed distance, and the distance a name NEEDS depends on how many others are competing
     for the same column. Picking "agent (not a skill)" lights five names; two of them sat a
     pixel apart in y, so one had to move a full pitch, which is further than the cap allows,
     so it vanished. Five names on an empty screen and one of them silently gone.

     The budget therefore scales with how crowded it is. Sixty names showing and it stays
     where it was; a handful and a name may go a long way, because there is nothing else up
     there to confuse it with. A name you asked to see and did not get is worse than a name
     sitting further from its dot than it might.

     34 rather than 14: measured, not guessed. Lighting each ring in turn and counting both
     withdrawals and actual overlapping glyph boxes, 14 still dropped four names from the
     eighteen-node rings; 34 drops none, and every set tested — 4, 5, 14, 18 — comes out with
     nothing withdrawn and nothing overlapping. */
  const OFF=LBLOFF*Math.max(1,Math.min(4,34/Math.max(1,items.length)));
  const PUSH = 1;                     // names stack downward
  const placed=ringBoxes.slice();     // ring titles are fixed obstacles, never moved
  // Obstacles carry their own required clearance: a fat disc needs more room above and
  // below it than a text row does, so a flat pitch left labels sitting on the big nodes.
  // the core moves and scales with the view, so its obstacle has to as well
  const acx=toScreenX(AX), acy=toScreenY(AY), ar=34*coreScale()*zoom;
  placed.push({x0:acx-ar,x1:acx+ar,ty:acy,h:ar+6});
  // Only the nodes that are themselves being named are obstacles. Dodging every dot on
  // screen meant a single label had 55 of them in its column, got pushed past the
  // displacement cap, and was withdrawn — a framed node with nothing but a dot. A name
  // crossing an unlit dot is not ambiguous: unlit dots have no names to be confused with,
  // and the label carries a dark halo stroke to stay legible over one.
  for(const it of items)
    placed.push({owner:it.n,x0:it.n.sx-it.n.srad-3,x1:it.n.sx+it.n.srad+3,
                 ty:it.n.sy,h:it.n.srad+5});
  for(const it of items){
    for(let guard=0,moved=true; moved&&guard<80; guard++){
      moved=false;
      for(const p of placed)
        { if(p.owner===it.n) continue;              // never dodge your own dot
          const gap=p.h||PITCH;
          if(it.x0<p.x1 && p.x0<it.x1 && Math.abs(it.ty-p.ty)<gap){ it.ty=p.ty+gap*PUSH; moved=true; } }
    }
    placed.push(it);
  }
  // A long push chain can walk the last labels off-screen. Clamping them individually
  // would collapse rows back together, so shift the whole set — that keeps every gap.
  if(items.length){
    const hi=Math.max(...items.map(i=>i.ty)), lo=Math.min(...items.map(i=>i.ty));
    let shift=hi>H-10 ? (H-10)-hi : 0;
    if(lo+shift<10) shift=10-lo;
    if(shift) for(const i of items) i.ty+=shift;
  }
  const kept=[];
  for(const s of items){
    const t=s.el._t, ld=s.el._ld;
    // withdraw rather than drag: also covers nodes panned outside the safe gutter, whose
    // labels the clamp would otherwise sling across the whole screen
    // The displacement cap can stop a push before the row is actually clear, which leaves
    // two names touching. Two names touching is worse than one name missing, so the
    // second one goes.
    let clash=false;
    for(const k of kept)
      if(s.x0<k.x1 && k.x0<s.x1 && Math.abs(s.ty-k.ty)<PITCH*0.92){ clash=true; break; }
    const far = clash || Math.abs(s.ty-s.n.sy)>OFF ||
                s.x0<SAFE_L-40 || s.x1>SAFE_R+40 || s.n.sy<-20 || s.n.sy>H+20;
    s.el.classList.toggle('toofar',far);
    if(far){ s.n._ldy=0; t.setAttribute('y',3); ld.style.opacity=0; continue; }
    kept.push(s);
    // glide into the clear slot rather than snapping to it
    const target=s.ty-s.n.sy;
    if(s.n._ldy===undefined) s.n._ldy=0;
    // In the flat views the label lands rather than glides. The glide is a per-frame state
    // that the withdraw rule then reads back: a label part-way to its slot can still be
    // touching its neighbour, which withdraws it, which resets it toward zero, which clears
    // the touch, which lets it start again. It never settles, and the leader lines swing
    // about at angles that belong to no particular frame — the "random lines". Nodes here
    // do not move, so there is nothing for the glide to smooth over anyway.
    if(FLAT()) s.n._ldy=target;
    else if(Math.abs(target-s.n._ldy)>.4){ s.n._ldy+=(target-s.n._ldy)*EASE; easing=true; }
    else s.n._ldy=target;
    const oy=s.n._ldy;
    t.setAttribute('x',s.ax); t.setAttribute('y',(oy+3).toFixed(1));
    t.setAttribute('text-anchor',s.left?'end':'start');
    // where this name ended up, in world units, so a link can go round it rather than
    // through it. Screen to world is the inverse of the pan and zoom the links are drawn in.
    LBLBOX.push({x0:(s.x0-panX)/zoom, x1:(s.x1-panX)/zoom,
                 y0:(s.ty-LBLH*0.50-panY)/zoom, y1:(s.ty+LBLH*0.40-panY)/zoom});
    // No leader lines. They were how a name that had nowhere to go still pointed at its
    // dot; with the flat views zooming to a selection the name has somewhere to go, and a
    // line to every name is more ink than the thing it explains.
    ld.style.opacity = 0;
    ld.setAttribute('x1',s.left?-(s.n.srad+2):(s.n.srad+2)); ld.setAttribute('y1',0);
    ld.setAttribute('x2',(s.ax*.92).toFixed(1)); ld.setAttribute('y2',oy.toFixed(1));
  }
  paintMask();
}
/* One ribbon per skill, from where it sits to where it belongs. Drawn here rather than built
   once in scaffold() because the settle animates the nodes into place and a path laid down
   before they arrive is a path to where they used to be.

   The control points are deliberately far apart horizontally and level with each end: that
   is what makes a hundred curves leaving one area for four points read as four streams
   rather than as a hundred lines. Bundling them any harder would be a lie about how many
   there are. */
function flowPaths(){
  gFlow.style.display='';
  const want=N.length;
  while(gFlow.childNodes.length<want)
    gFlow.appendChild(mk('path',{fill:'none','stroke-width':.85,'stroke-linecap':'round'}));
  N.forEach((n,i)=>{
    const el=gFlow.childNodes[i], h=HUB[n.ring];
    if(!h||nodeEl[i].style.display==='none'){ el.style.display='none'; return; }
    el.style.display='';
    const dx=(h.x-n.x);
    el.setAttribute('d',`M${n.x.toFixed(1)},${n.y.toFixed(1)}`
      +`C${(n.x+dx*.42).toFixed(1)},${n.y.toFixed(1)} `
      +`${(h.x-dx*.30).toFixed(1)},${h.y.toFixed(1)} ${h.x.toFixed(1)},${h.y.toFixed(1)}`);
    el.setAttribute('stroke',paintOf(n));
    // A lit node's ribbon comes forward with it; the rest stay faint enough that sixty of
    // them are a texture rather than a thicket. The lit/faded decision is apply()'s, taken
    // from the node's own class rather than recomputed here — two implementations of "is
    // this one lit" is how a ribbon ends up bright under a dimmed dot.
    const cl=nodeEl[i].classList, isSel=cl.contains('sel');
    el.setAttribute('stroke-opacity',cl.contains('faded')?.05:(isSel?.95:.40));
    el.setAttribute('stroke-width',isSel?1.9:.85);
  });
  for(let i=want;i<gFlow.childNodes.length;i++) gFlow.childNodes[i].style.display='none';
}
function paint(){
  N.forEach((n,i)=>{
    nodeEl[i].setAttribute('transform',`translate(${n.x.toFixed(1)},${n.y.toFixed(1)})`);
    n.sx=toScreenX(n.x); n.sy=toScreenY(n.y); n.srad=n.rad*zoom;
    labelEl[i].setAttribute('transform',`translate(${n.sx.toFixed(1)},${n.sy.toFixed(1)})`); });
  gA.setAttribute('transform',`translate(${oCX()},${oCY()}) scale(${coreScale().toFixed(4)})`);
  // Left visible, they drew over the board: sixty ribbons to four points that are not on the
  // screen any more, on top of a layout that has nothing to do with them.
  if(VIEW==='flow') flowPaths(); else if(gFlow.childNodes.length) gFlow.style.display='none';
  EDGES.forEach((e,i)=>{
    if(VIEW==='flow'){ edgeEl[i].style.display='none'; return; }  // the ribbons are the links
    edgeEl[i].style.display='';
    if(!edgeVis[i]) return;   // invisible edges do not need a path
    const a=e.a===ANCHOR.id?{x:AX,y:AY}:N[IDX[e.a]];
    const b=e.b===ANCHOR.id?{x:AX,y:AY}:N[IDX[e.b]];
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    let qx,qy;
    if(e.kind==='overlap' && VIEW!=='board'){ qx=mx+(AX-mx)*.45; qy=my+(AY-my)*.45; }
    else { qx=mx; qy=my; }                      // control point at the midpoint == straight
    edgeEl[i].setAttribute('d',`M${a.x.toFixed(1)},${a.y.toFixed(1)}Q${qx.toFixed(1)},${qy.toFixed(1)} ${b.x.toFixed(1)},${b.y.toFixed(1)}`); });
  dodge();
}
function tick(){
  // Labels easing must not keep the physics awake: moving nodes move the label targets,
  // which keeps easing alive, which keeps the nodes moving. Freeze the graph, glide the text.
  if(orbiting){ spinT+=1/60; orbitPlace(); trailStep(1/60); trailDraw();
    validateHover(); paint();
    raf=requestAnimationFrame(tick); return; }
  if(!settled){
    settleStep(); paint();
    raf=requestAnimationFrame(tick); return;
  }
  const live=(alpha>.05&&SIMULATE)||drag;
  if(live){ if(SIMULATE) sim(); alpha*=.997; validateHover(); }
  paint();
  raf=(live||easing)?requestAnimationFrame(tick):null;
}
function reheat(v){ alpha=Math.max(alpha,v); if(!raf) raf=requestAnimationFrame(tick); }
// redraw without waking the graph — used for selection, filters and label easing,
// none of which should move a node
function kick(){ if(!raf) raf=requestAnimationFrame(tick); }

/* ------------------------------------------------------------------ state */
const nrm=t=>t.toLowerCase();
const settledOf=n=>!!FIXES[n.id] && !isOpen(n.id);
// Nothing in the key hides a node any more — picks light instead — so visibility is
// only ever the search, and only when the search found nothing to light.
const visible=n=>true;
function score(n,q){ const id=nrm(n.id), i=id.indexOf(q);
  if(i===0)return 0;
  if((n.tags||[]).some(t=>t===q))return 1;            // exact capability match
  if(i>0)return 2;
  if((n.tags||[]).some(t=>t.includes(q)))return 3;
  if(nrm(PHASES[n.phase]||'').includes(q))return 4;
  if(nrm(n.desc.replace(/<[^>]+>/g,'')).includes(q))return 5; return -1; }

function apply(){
  const focus=sel||hover;
  // At 62 nodes, focusing the root and lighting everything was a useful gesture. At a
  // thousand it is a hairball and a 30ms label pass, so the root lights only what binds
  // to it unconditionally — the organisation and repository surfaces.
  const lit=focus?new Set([focus,...(focus===ANCHOR.id
    ? N.filter(n=>n.ring==='org').map(n=>n.id)
    : [...(neigh[focus]||[]),ANCHOR.id])]):null;
  // A search and a pick are the same gesture — "show me these" — so they light through
  // the same channel and add rather than compete.
  const picked=pickedIds();
  const lit2=(query&&hits)||picked
    ? new Set([...((query&&hits)?hits:[]),...(picked||[])])
    : null;
  // Beyond what the viewport can stack, naming everything at once is noise, not a firehose.
  // Two columns of rows is the ceiling; past it, fall back to the selection and hover only.
  // How many names can be shown is a function of the view, not the viewport. At 100% the
  // median gap between nodes is 10px, so ninety names cannot each sit beside their dot —
  // they get withdrawn and you see almost nothing. Fewer names, each in the right place,
  // and the budget grows as you zoom in and the nodes move apart.
  const CAP=Math.max(12,Math.min(Math.floor(2*(H-20)/LBLH),Math.round(12*zoom+6)));
  // Past the cap the old behaviour was to name nothing but the selection, which at this
  // scale means selecting the root lit a hundred nodes and named none of them. Name the
  // ones nearest the thing you focused instead — a full screen of labels, closest first.
  // Which names to show is decided by which ones have somewhere to go. Ranking by
  // distance from the focus picked exactly the most crowded nodes on the map, and every
  // one of them then failed the displacement cap — a hundred candidates, nothing drawn.
  // Rank by elbow room instead: the isolated node gets named, the one in the middle of a
  // pile does not, and zooming in is what gives the pile room.
  const cand=[];
  N.forEach(n=>{ if(visible(n) && ((!!lit2&&lit2.has(n.id))||(!!lit&&lit.has(n.id))||n.id===hover))
    cand.push(n); });
  let nameable=null;
  if(cand.length>CAP){
    const room=cand.map((n,i)=>{ let m=Infinity;
      for(let j=0;j<cand.length;j++){ if(i===j) continue;
        const d=(n.x-cand[j].x)**2+(n.y-cand[j].y)**2; if(d<m) m=d; }
      return [n.id,m]; });
    room.sort((p,q)=>q[1]-p[1]);
    nameable=new Set(room.slice(0,CAP).map(r=>r[0]));
    if(sel) nameable.add(sel); if(hover) nameable.add(hover);
  }
  N.forEach((n,i)=>{ const el=nodeEl[i];
    el.style.display=visible(n)?'':'none';
    const isHit=!!lit2&&lit2.has(n.id), isLit=!!lit&&lit.has(n.id);
    const lg=labelEl[i]; lg.style.display=el.style.display;
    // A tag search and a selection are two ways of lighting the map, and they used to
    // fight: a search hit that was not also a neighbour of the selected node got faded
    // to nothing while its label stayed lit, which is how a name ended up floating with
    // no dot under it. One rule now — lit is the union, faded is everything else.
    const on=isHit||isLit||n.id===sel;
    const state=[n.id===sel, isHit,
      // Nothing is named until it has landed: a name on a node still travelling is a
      // label for wherever that node happens to be a frame later.
      settled && !orbiting && (on||n.id===hover) &&
        (!nameable||nameable.has(n.id)||n.id===sel||n.id===hover),
      (!!lit||!!lit2) && !on && n.id!==hover];
    // Most nodes are unchanged between two states of the map. At 62 rewriting all of
    // them anyway cost nothing; at a thousand it is eight thousand class writes for a
    // single hover, so skip the ones whose four flags did not move.
    const kstr=state.join('')+el.style.display;
    if(n._kstate===kstr) return;
    n._kstate=kstr;
    const NAMES=['sel','hit','show','faded'];
    for(let k=0;k<4;k++){ el.classList.toggle(NAMES[k],state[k]); lg.classList.toggle(NAMES[k],state[k]); } });
  // The core is the landmark everything else is positioned against, not a result, so a
  // pick never dims it — picking "excluded" left the middle of the map an empty smudge.
  // A selection or a search still does, because then it genuinely is or is not a match.
  const aOn = sel===ANCHOR.id || (!!lit&&lit.has(ANCHOR.id)) || (!!lit2&&lit2.has(ANCHOR.id))
    || (!lit && !query);
  gA.classList.toggle('sel',sel===ANCHOR.id);
  gA.classList.toggle('faded',(!!lit||!!lit2)&&!aOn);
  EDGES.forEach((e,i)=>{
    const na=e.a===ANCHOR.id?null:N[IDX[e.a]], nb=e.b===ANCHOR.id?null:N[IDX[e.b]];
    let o=0;
    // The board draws links only for what you have selected, and draws them straight. The
    // thicket before came from curving them toward the centre, which on a row of columns
    // sends every line on a detour through the middle of the board; a straight line between
    // two columns crosses only what is between them.
    if(VIEW==='board' && !focus) { edgeVis[i]=0; edgeEl[i].setAttribute('stroke-opacity',0); return; }
    if((!na||visible(na))&&(!nb||visible(nb))){
      // In the arc the overlaps ARE the picture: a row of dots with
      // nothing over it, or a scatter with nothing between it, is the one thing those
      // layouts have nothing to say. They stay drawn at rest and lift when something is
      // focused, rather than appearing only on a click. The radial view still hides them —
      // there they cross the middle and make a hairball rather than a diagram.
      if(VIEW==='arc'&&e.kind==='overlap')
        o = focus&&(e.a===focus||e.b===focus) ? .95
          : (lit||lit2) ? .07 : .34;
      else if(focus&&(e.a===focus||e.b===focus)) o=e.kind==='overlap'?.9:e.kind==='bind'?.85:.45;
      // A fan from the root to all 1024 is a purple wall, not a diagram. Draw only the
      // links to what the root actually lights.
      else if(focus===ANCHOR.id&&e.a===ANCHOR.id&&lit&&lit.has(e.b)) o=.75; }
    edgeVis[i]=o>0;
    edgeEl[i].setAttribute('stroke-opacity',o);
    edgeEl[i].setAttribute('stroke-dashoffset',o?0:1); });   // links draw themselves in
  $('hint').classList.toggle('gone',!!sel||!!query);
  kick();
}

/* ------------------------------------------------------------------ clipboard */
async function copy(text,btn){
  let ok=true;
  try{ await navigator.clipboard.writeText(text); }
  catch(e){
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.cssText='position:fixed;opacity:0;pointer-events:none';
    document.body.appendChild(ta); ta.select();
    try{ ok=document.execCommand('copy'); }catch(_){ ok=false; }
    ta.remove();
  }
  const was=btn.innerHTML;
  btn.textContent = ok ? 'Copied' : 'Press ⌘C';
  btn.classList.toggle('ok',ok);
  setTimeout(()=>{ btn.innerHTML=was; btn.classList.remove('ok'); },1600);
}
const ENT={'&ldquo;':'"','&rdquo;':'"','&lsquo;':"'",'&rsquo;':"'",'&mdash;':'—',
  '&ndash;':'–','&hellip;':'…','&nbsp;':' ','&amp;':'&','&lt;':'<','&gt;':'>'};
const plain=h=>h.replace(/<br\s*\/?>/gi,'\n\n').replace(/<[^>]+>/g,'')
  .replace(/&[a-z]+;/gi,m=>ENT[m.toLowerCase()]??m).replace(/\n{3,}/g,'\n\n').trim();

/* ---- the findings panel ----------------------------------------------------------------
   Every finding, open and settled, in one place. Two things this changes.

   They were only readable by finding the node each one belonged to, which meant you had to
   already know what you were looking for. And a settled finding had nowhere to be read at
   all: it keeps the record of what was found and why, which does not stop being worth
   reading because it was dealt with.

   The other change is what the copy buttons produce. The old brief opened by telling the
   reader to work top to bottom, so pasting it started the work — on findings that are, by
   their own labels, sometimes unverified guesses. It now asks for the premise to be checked
   and discussed first, and says plainly that closing an item because it was wrong is a
   result. Same content; it stops being an instruction and becomes a question. */
const DISCUSS =
"**Discuss before changing anything.** What follows is a set of findings from a map of this\n"+
"library, not a work order. Some are confirmed against the documents and some are guesses from\n"+
"names — each one says which, and one that was wrong is worth more closed than quietly acted on.\n\n"+
"So: read them, check the premise of each against what is actually on disk, and come back with\n"+
"what you think. Say which you agree with, which you would close as wrong, and which you cannot\n"+
"check from where you are running. Change nothing until that has been agreed.\n\n";

function fitem(n){
  const [b]=BASIS[n.id]||['unverified'];
  const st={present:'available',missing:'missing',never:'excluded'}[statusOf(n)]||'anchor';
  return "# "+n.id+"\n\n"+
    "**State:** "+BASIS_LABEL[b]+" · "+st+" · "+(PHASES[n.phase]||'anchor')+"\n"+
    "**Run from:** "+(WHERE[n.id]||'repo')+
      (NEEDS[n.id] ? "  ·  **Needs:** "+NEEDS_LABEL[NEEDS[n.id]] : "")+"\n\n"+
    "**What the map observed:** "+plain(n.desc)+"\n\n"+
    "**The finding:**\n"+FIXES[n.id]+"\n";
}
function allFindings(){
  return [ANCHOR].concat(N).filter(n=>FIXES[n.id])
    .sort((a,b)=>(BASIS[a.id]||['',99])[1]-(BASIS[b.id]||['',99])[1]);
}
function methodBlock(id){
  const ks=(VIA&&VIA[id])||[];
  if(!ks.length) return "";
  return "**How this was reached:** "+ks.map(k=>METHODS[k]?METHODS[k].name:k).join(", ")+"\n\n"+
    ks.map(k=>{ const m=METHODS[k]; if(!m) return "";
      return "- **"+m.name+"** — "+plain(m.how)+" *Cannot tell you:* "+plain(m.blind)+
             " *Lives in:* "+plain(m.where);
    }).filter(Boolean).join("\n")+"\n";
}
function briefHow(){
  return "# How this map decides things\n\n"+
    "Everything on the skills map was reached one of these ways. I am showing you the\n"+
    "mechanisms rather than describing my reasoning, because these ARE the reasoning — there\n"+
    "is no separate judgement happening on top of them.\n\n"+
    "**What I want from you:** tell me which of these you disagree with, and how you would\n"+
    "rather it worked. A method whose blind spot does not matter to you should be trusted\n"+
    "more; one whose blind spot is exactly your problem should be weakened or dropped. Then\n"+
    "we change the setting and rebuild, and every finding that rested on it changes with it.\n\n"+
    "Do not change any of this yet. Discuss it first.\n\n---\n\n"+
    Object.entries(METHODS).map(([k,m])=>
      "## "+m.name+"\n\n"+
      "**What it does:** "+plain(m.how)+"\n\n"+
      "**What it cannot tell you:** "+plain(m.blind)+"\n\n"+
      "**Where it lives:** "+plain(m.where)+"\n\n"+
      "**The knob:** "+plain(m.knob)+"\n"
    ).join("\n---\n\n")+
    "\n---\n\n## Questions worth asking me\n\n"+
    "- Which of these should I trust less than I do?\n"+
    "- Is the overlap threshold right, or is it reporting pairs you do not care about?\n"+
    "- Should a skill with no build-plan placement be guessed at all, or left unplaced?\n"+
    "- Is 30 days the right life for the new tag?\n"+
    "- What am I deciding by a method that is not on this list? That would be a gap.\n";
}
function briefOne(n){
  return DISCUSS+"---\n\n"+fitem(n)+
    "\n"+methodBlock(n.id)+
    "\n---\n\nTwo things to come back on, not one.\n\n"+
    "**The finding.** Is it right? If the premise does not survive contact with the files, say\n"+
    "so and close it — that counts. If it does, say what you would change, and wait for a yes.\n\n"+
    "**The method.** The way it was reached is listed above, with what each method cannot tell\n"+
    "you. If the conclusion is wrong, say which method got it wrong and how it should work\n"+
    "instead — that fixes every other finding resting on the same one, not just this.\n";
}
function briefAll(rows){
  const all=rows||allFindings(), open=all.filter(n=>isOpen(n.id));
  return "# The skills library — "+all.length+(all.length===1?" finding":" findings")+
    ", "+open.length+" still open\n\n"+DISCUSS+
    "They are ordered by dependency: several touch the same paragraph, so if we do act, top to\n"+
    "bottom rather than in parallel. Settled ones are included because the record of what was\n"+
    "found and why is the useful part, not the tick.\n\n---\n\n"+
    all.map(n=>fitem(n)+"\n"+methodBlock(n.id)).join("\n---\n\n")+
    "\n---\n\n## What I want back\n\n"+
    "Three lists: which findings you agree with, which you would close because the premise is\n"+
    "wrong, and which you cannot check from where you are running — naming where they would have\n"+
    "to be run instead.\n\n"+
    "Then a fourth thing, which matters more than the three. Every finding above says how it was\n"+
    "reached. If several are wrong, they will usually be wrong through the same method — say\n"+
    "which one and how it should work instead. Changing a method changes every finding that\n"+
    "rested on it; arguing them one at a time fixes the symptom.\n";
}

/* The finding text is markdown-ish. Only the two marks it actually uses are converted, and
   everything is escaped first — these strings are mine, but converting HTML I did not escape
   is a habit that outlives the file it was safe in. */
const fmt = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
  // \x60 rather than a literal backtick: this is spliced into a template literal below, and
  // a backtick inside one ends it
  .replace(/\x60([^\x60]+)\x60/g,'<code>$1</code>');

/* 'all' or 'open'. Clicking the open-items row in the key used to light the flagged nodes and
   stop there — you were told there was one, shown which dot it was, and given no way to read
   it. That row now opens this panel on the open ones. */
let findFilter='all';
/* The strip under each finding: which of the seven mechanisms produced it. Clicking one
   opens the rules tab rather than a tooltip, because "what is this method" and "how do I
   change it" are the same question and the answer is longer than a hover. */
function via(id){
  const ks=(VIA&&VIA[id])||[];
  if(!ks.length) return '';
  return '<div class="f-via"><span>Reached by</span>'+
    ks.map(k=>{ const m=METHODS[k]; if(!m) return '';
      return '<button class="mchip'+(k==='infer'?' weak':'')+'" data-how="'+k+'">'+m.name+'</button>';
    }).join('')+'</div>';
}

/* The rules themselves. "How can I change the way you think" has a literal answer: seven
   mechanisms, each with a file and a setting. This is that list, not a description of it. */
function drawHow(all,open){
  const el=$('findings');
  el.innerHTML='<button class="close" aria-label="Close">✕</button>'+
    '<div class="f-head"><h3>How it decides</h3><span>'+Object.keys(METHODS).length+' methods</span></div>'+
    '<div class="f-intro">Everything on this map was reached one of these ways. Each says what '+
    'it cannot tell you and where its setting lives — change the setting, change the findings. '+
    'Nothing here is a judgement call I make freshly each time; if a conclusion is wrong, one '+
    'of these is why.</div>'+
    '<div class="f-tabs">'+
      '<button data-ff="all">All '+all.length+'</button>'+
      (open.length?'<button data-ff="open">Open '+open.length+'</button>':'')+
      '<button data-ff="how" class="on">How it decides</button></div>'+
    '<button class="copy f-all" id="f-copyhow">Copy this, to change how it decides</button>'+
    Object.entries(METHODS).map(([k,m])=>{
      const used=Object.entries(VIA||{}).filter(([,v])=>v.includes(k)).length;
      return '<div class="f-item" id="how-'+k+'">'+
        '<div class="f-top"><span class="n">'+m.name+'</span>'+
        '<span class="f-state '+(k==='infer'?'open':'done')+'">'+used+' finding'+(used===1?'':'s')+'</span></div>'+
        '<div class="f-body">'+m.how+'</div>'+
        '<div class="f-blind"><b>What it cannot tell you.</b> '+m.blind+'</div>'+
        '<div class="f-knob"><b>To change it.</b> '+m.knob+'<br><code>'+m.where+'</code></div>'+
      '</div>';}).join('');
  el.querySelector('.close').onclick=e=>{ e.stopPropagation(); closeFindings(); };
  el.querySelectorAll('[data-ff]').forEach(btn=>btn.onclick=e=>{ e.stopPropagation();
    findFilter=btn.dataset.ff; drawFindings(); $('findings').scrollTop=0; });
  $('f-copyhow').onclick=e=>{ e.stopPropagation(); copy(briefHow(),e.currentTarget); };
}

function drawFindings(){
  const all=allFindings(), open=all.filter(n=>isOpen(n.id));
  const rows = findFilter==='open' ? open : all;
  if(findFilter==='how'){ drawHow(all,open); return; }
  $('findbtn').innerHTML='<span>Findings</span><b>'+all.length+'</b>'+
    '<i>'+(open.length ? open.length+' still open' : 'all settled — the record stays')+'</i>';
  const el=$('findings');
  el.innerHTML='<button class="close" aria-label="Close">✕</button>'+
    '<div class="f-head"><h3>Findings</h3><span>'+all.length+' · '+open.length+' open</span></div>'+
    '<div class="f-intro">Every finding the map has made, settled ones included — a settled one '+
    'still records what was found and why. Copy asks for a discussion first, not a rewrite.</div>'+
    '<div class="f-tabs">'+
      '<button data-ff="all"'+(findFilter==='all'?' class="on"':'')+'>All '+all.length+'</button>'+
      (open.length ? '<button data-ff="open"'+(findFilter==='open'?' class="on"':'')+
        '>Open '+open.length+'</button>' : '')+
      '<button data-ff="how"'+(findFilter==='how'?' class="on"':'')+'>How it decides</button>'+
      '</div>'+
    '<button class="copy f-all" id="f-copyall">Copy '+
      (findFilter==='open'&&open.length!==all.length ? 'the '+rows.length+' open' : 'all '+rows.length)+
      ', to discuss</button>'+
    rows.map(n=>{
      const isO=isOpen(n.id), [b]=BASIS[n.id]||['unverified'];
      return '<div class="f-item">'+
        '<div class="f-top"><span class="n">'+esc(n.id)+'</span>'+
        '<span class="f-state '+(isO?'open':'done')+'">'+(isO?BASIS_SHORT[b]:'settled')+'</span>'+
        '<button class="copy f-copy" data-fx="'+esc(n.id)+'">Copy</button></div>'+
        '<div class="f-body">'+fmt(FIXES[n.id])+'</div>'+
        via(n.id)+
        '<button class="f-go" data-fgo="'+esc(n.id)+'">Show it on the map →</button>'+
      '</div>';}).join('');
  el.querySelector('.close').onclick=e=>{ e.stopPropagation(); closeFindings(); };
  el.querySelectorAll('[data-ff]').forEach(btn=>btn.onclick=e=>{ e.stopPropagation();
    findFilter=btn.dataset.ff; drawFindings(); $('findings').scrollTop=0; });
  $('f-copyall').onclick=e=>{ e.stopPropagation(); copy(briefAll(rows),e.currentTarget); };
  el.querySelectorAll('[data-fx]').forEach(btn=>btn.onclick=e=>{ e.stopPropagation();
    const n=allFindings().find(x=>x.id===btn.dataset.fx); copy(briefOne(n),btn); });
  el.querySelectorAll('[data-fgo]').forEach(btn=>btn.onclick=e=>{ e.stopPropagation();
    closeFindings(); select(btn.dataset.fgo); });
  el.querySelectorAll('[data-how]').forEach(btn=>btn.onclick=e=>{ e.stopPropagation();
    findFilter='how'; drawFindings();
    const t=$('how-'+btn.dataset.how);
    if(t) t.scrollIntoView({block:'center'});
    if(t){ t.classList.add('flash'); setTimeout(()=>t.classList.remove('flash'),1400); } });
}
function openFindings(filter){
  // the two panels share a slot on a wide screen, so they cannot both be up

}
function closeFindings(){ $('findings').hidden=true; $('findbtn').classList.remove('on'); }

function brief(){
  const all=[ANCHOR].concat(N).filter(n=>FIXES[n.id])
    .sort((a,b)=>(BASIS[a.id]||['',99])[1]-(BASIS[b.id]||['',99])[1]);
  const rows=all.filter(n=>isOpen(n.id));
  const counts={};
  rows.forEach(n=>{ const k=(BASIS[n.id]||['unverified'])[0]; counts[k]=(counts[k]||0)+1; });
  const needs={};
  rows.forEach(n=>{ const k=NEEDS[n.id]; if(k) needs[k]=(needs[k]||0)+1; });
  const tally=Object.entries(counts)
    .map(([k,v])=>`${v} ${BASIS_SHORT[k]}`).join(', ');
  return `# ${COMPANY} · Copilot Enterprise — ${rows.length} open items\n\n`+

    BASIS_ORDER.filter(k=>counts[k]).map(k=>
      `| **${BASIS_SHORT[k]}** | ${counts[k]} | ${BASIS_MEANS[k]} |`).join('\n')+`\n\n`+
    `\n**Nothing here is finished.** Drafted means the text is written but not pasted; corrected `+
    `means I fixed my claim, not that the question is settled. Every one of the ${rows.length} `+
    `still needs something from you:\n\n`+
    `| What it still needs | Count |\n|---|---|\n`+
    NEEDS_ORDER.filter(k=>needs[k]).map(k=>`| ${NEEDS_LABEL[k]} | ${needs[k]} |`).join('\n')+`\n\n`+
    `Ordered by dependency: several edit the same paragraph, so work top to bottom rather than in `+
    `parallel. Step 1 may close some of the unverified ones outright.\n\n`+
    PREAMBLE+`\n`+
    rows.map((n,i)=>{
      const st={present:'available',missing:'missing',never:'excluded'}[statusOf(n)];
      const [b]=BASIS[n.id]||['unverified'];
      return `## Step ${i+1} — ${n.id}  (${st}, ${PHASES[n.phase]||'anchor'}) — ${BASIS_LABEL[b]}\n\n`+
        `**Run from:** ${WHERE[n.id]||'repo'}  ·  **Needs:** ${NEEDS_LABEL[NEEDS[n.id]]||'—'}\n\n`+
        `**What I observed:** ${plain(n.desc)}\n\n`+
        `**Fix:**\n${FIXES[n.id]}\n`;
    }).join('\n---\n\n')+
    `\n\n---\n\n## When you finish\n\n`+
    `Report three lists: what you changed, what you could not reach and exactly where to run it, `+
    `and anything you closed because the premise turned out to be wrong. Several of these are `+
    `marked unverified precisely so that closing them counts as a result.\n\n`+
    `Then update vibehq/docs/skills-map/skills-map.html — the BASIS entry for each step you `+
    `settled — and append to docs/decisions.md and docs/gotchas.md as that repo's agreement `+
    `requires. Commit and push: that repo treats an unpushed change as unbacked up.\n\n`+
    `The workspace library is a git repo (G-001) and now has a remote (D-010): `+
    `github.com/Joenebula/skills. If you changed a SKILL.md there, commit and push it too — `+
    `that is the whole point of step 1. The account library at ~/.claude/skills is not a repo, `+
    `so say which files you touched there, or nothing records it.\n`;
}
