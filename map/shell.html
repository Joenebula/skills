/* A column heading, opened. Same panel a skill uses, because it answers the same shape of
   question — what is this, what is in it, what does being in it imply — and a second panel
   somewhere else would be a second thing to learn. */
function groupPanel(key){
  const list=N.filter(n=>groupOf(n)===key);
  const t=key==='agreement'?['Agreement','governs all']:phaseTitle(key);
  const col=key==='agreement'?cv('--amber'):(SECTOR[key]||cv('--ink3'));
  const members=key==='agreement'
    ? `<button class="relbtn" data-go="${ANCHOR.id}">${ANCHOR.id}</button>`
    : list.map(n=>`<button class="relbtn" data-go="${esc(n.id)}">${esc(n.id)}</button>`).join('');
  const unver=list.filter(n=>EVIDENCE[n.id]==='named').length;
  sel=null; $('detail').classList.add('on');
  $('detail').innerHTML=`<button class="close" aria-label="Close">✕</button>
    <div class="d-name">${esc(t[0])}</div>
    <div class="d-stamp">${esc(t[1]||'')}</div>
    <div class="d-meta"><span class="tag st" style="background:${col};color:var(--void)">${
      key==='agreement'?'1 file':list.length+(list.length===1?' skill':' skills')}</span>${
      unver?`<span class="tag">${unver} unverified</span>`:''}</div>
    <div class="d-desc">${GROUP_ABOUT[key]||'No note written for this column yet.'}</div>
    <div class="d-rel"><div class="lbl">In this column</div>${members}</div>`;
  $('detail').querySelector('.close').onclick=()=>{
    $('detail').classList.remove('on'); gutters(); apply(); kick(); };
  $('detail').querySelectorAll('[data-go]').forEach(b=>
    b.onclick=()=>select(b.dataset.go));
  gutters();
}

/* PLACED — a skill the build put in a column by resemblance because nothing places it. It
   sits in a real column so it can be found where you would look for it, and the tag still
   says it is new; the panel then says the column is a guess and names what it was matched
   against, so you can judge the guess.

   Rendered on its own line rather than inside the date chain. A newly discovered skill is
   both new AND placed by guesswork, and putting the two in one if/else meant the more
   interesting of them was never shown. */
function detail(id){
  const n=id===ANCHOR.id?ANCHOR:N[IDX[id]];
  const st=statusOf(n);
  const lab={present:'available',missing:'missing',never:'excluded'}[st];
  const col={present:'--present',missing:'--missing',never:'--never',anchor:'--amber'}[st];
  // Drop any later tag whose text is already contained in an earlier one — otherwise a
  // built-in reads "Built into Claude Code / CLAUDE CODE / built-in", three ways of once.
  const raw = n.ring
    ? [[lab,1],[PHASES[n.phase],0],[RINGS.find(R=>R.key===n.ring).label,0],[n.src,0]]
    : [['the anchor',1],[n.src,0]];
  const key=t=>t.toLowerCase().replace(/[^a-z0-9]/g,'');
  const kept=[];
  for(const [text,isStatus] of raw){
    const k=key(text);
    if(kept.some(x=>key(x[0]).includes(k))) continue;
    kept.push([text,isStatus]);
  }
  const tags = kept.map(([text,isStatus])=>isStatus
    ? `<span class="tag st" style="background:var(${col})">${text}</span>`
    : `<span class="tag">${text}</span>`);
  const rel=[...(neigh[id]||[])];
  const LOC = n.ring ? locationOf(id) : null;
  $('detail').innerHTML=`<button class="close" aria-label="Close">✕</button>
    <div class="d-name">${n.id}</div>
    ${n.ring?`<div class="d-stamp">${
      VER[id]?`<b>v${VER[id]}</b><span class="dot">·</span>`:''}${
      META[id]
        ? `Updated ${niceDate(META[id][0])}<span class="dot">·</span>${META[id][1]}`
        : `<i>No version or date recorded</i>`}</div>`:''}
    <div class="d-meta">${tags.join('')}${
      NEWTAG.has(id)?'<span class="tag" style="background:rgba(94,200,240,.20);color:var(--r3)">new</span>':''}</div>
    ${NEWTAG.has(id)&&LIVE[id]&&LIVE[id].added
      ? `<div class="d-new">Added ${ago(LIVE[id].added)} \u00b7 ${LIVE[id].added}</div>`
    // A skill that was already there when the library was first committed is older than the
    // repo by an unknown amount. Saying "added 9 July" would be a lie the git history invites.
    : LIVE[id]&&LIVE[id].since
      ? `<div class="d-new" style="opacity:.72">In the library since before it was version-controlled on ${LIVE[id].since}</div>`
    /* Found on disk, in a library with no git history behind it. The rule stands — the repo
       owns the clock, and no clock beats a wrong one — but applied silently it produces the
       worst outcome there is: you add a skill, the map finds it, and it appears with no tag
       and nothing saying why. So it says why, and says what closes it. */
    : NOCLOCK.has(id)
      ? `<div class="d-noclock"><b>No date for this one.</b> It was read from your account
         library at <code>~/.claude/skills</code>, which is not a git repository — so nothing
         knows when it arrived, and a skill with no date is never tagged new. Commit it to
         <code>github.com/Joenebula/skills</code> and the next build tags it.</div>` : ''}
    <div class="d-desc">${n.desc||'<i>No note written for this one yet.</i>'}</div>
    ${LIVE[id]&&LIVE[id].desc
      ? `<div class="d-own"><span class="lbl">Its own description</span>${esc(LIVE[id].desc)}</div>` : ''}
    ${PLACED[id]
      ? `<div class="d-placed"><b>This column is a guess.</b> Nothing in the build plan places
         this skill, so the map put it in <b>${esc(phaseTitle(PLACED[id].group)[0])}</b> —
         the column whose skills its description most resembles, nearest being
         <code>${esc(PLACED[id].near)}</code>. Name it in <code>BUILD-PLAN.md</code> §10 and
         the guess is replaced by your answer.</div>` : ''}
    ${LOC?`<div class="d-loc"><div class="lbl">Location</div>
      <div class="locrow">
        <code class="locpath"><b>${esc(LOC.repo)}</b> · ${esc(LOC.path)}</code>
        <button class="loccopy" data-loc="1">Copy link</button></div>
      <div class="locfull" id="locfull" hidden><code>${esc(LOC.url)}</code></div>
      <div class="locnote">Invented repository — this resolves to nothing.</div></div>`:''}
    ${rel.length?`<div class="d-rel"><div class="lbl">Trigger overlap — ${rel.length}</div>
      ${rel.map(r=>`<button class="relbtn" data-go="${r}">${r}</button>`).join('')}</div>`:''}
    ${(n.tags||[]).length?`<div class="d-tags"><div class="lbl">Tags</div>
      ${n.tags.map(t=>`<button class="cap${query===t?' on':''}" data-tag="${t}">${t}</button>`).join('')}</div>`:''}
    ${FIXES[id]&&isOpen(id)?`<div class="d-fix" role="note" aria-label="Open finding">
      <div class="lbl">
        <svg class="warn" viewBox="0 0 16 16" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
             stroke-linejoin="round">
          <path d="M8 1.9 15 14H1L8 1.9Z"/><path d="M8 6.4v3.4"/><path d="M8 11.9h.01"/>
        </svg>
        Needs fixing
        <button class="copy" data-copy="one">Copy</button></div>
      <div class="basisrow">
        <span class="basis ${(BASIS[id]||['unverified'])[0]}">step ${(BASIS[id]||['',0])[1]} · ${BASIS_LABEL[(BASIS[id]||['unverified'])[0]]}</span></div>
      <pre>${esc(FIXES[id])}</pre></div>`:''}`;
  $('detail').classList.add('on');
  $('detail').querySelector('.close').onclick=()=>select(null);
  $('detail').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>select(b.dataset.go));
  // a tag is a toggle: click to filter by it, click the lit one again to clear
  $('detail').querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{
    const t=b.dataset.tag, off=query===t;
    $('detail').querySelectorAll('[data-tag]').forEach(o=>o.classList.remove('on'));
    if(off){ $('q').value=''; query=''; hits=null; $('capsel').value=''; apply(); }
    else { b.classList.add('on'); runTag(t); }
    closeResults(); });
  const lb=$('detail').querySelector('[data-loc]');
  if(lb&&LOC) lb.onclick=e=>{ e.stopPropagation();
    copy(LOC.url,lb);
    const full=$('detail').querySelector('.locfull');
    if(full) full.hidden=false; };
  const cb=$('detail').querySelector('[data-copy]');
  if(cb) cb.onclick=()=>copy(FIXES[id],cb);
}
/* ---- the trail --------------------------------------------------------------------
   Newest at the top, joined by a line running down into the session. A place already
   seen moves back to the top rather than appearing twice, so the list is the set of
   places you have been in the order you last saw them, not a tally of clicks. */
const PATH_MAX=40;
let visited=[];
function record(id){
  if(!id) return;
  const at=visited.indexOf(id);
  if(at>=0) visited.splice(at,1);
  visited.unshift(id);
  if(visited.length>PATH_MAX) visited.length=PATH_MAX;
  drawPath();
}
function drawPath(){
  const box=$('pathpanel'), list=$('pp-list');
  box.hidden = visited.length===0;
  $('pp-n').textContent=visited.length;
  list.textContent='';
  visited.forEach(id=>{
    const n = id===ANCHOR.id ? ANCHOR : N[IDX[id]];
    if(!n) return;
    const col = id===ANCHOR.id ? cv('--amber') : paintOf(n);
    const b=document.createElement('button');
    b.type='button';
    b.className='ppstep'+(sel===id?' now':'');
    const dot=document.createElement('i'); dot.style.background=col;
    const nm=document.createElement('span'); nm.textContent=id; b.title=id;
    b.append(dot,nm);
    if(sel===id){ const h=document.createElement('em'); h.className='pphere';
      h.textContent='here'; b.append(h); }
    b.onclick=e=>{ e.stopPropagation(); select(id); };
    list.appendChild(b);
  });
  list.scrollTop=0;                       // the newest step is the one to keep in view
}
$('pp-clear').onclick=e=>{ e.stopPropagation(); visited=[]; drawPath(); gutters(); apply(); kick(); };

function select(id){
  // they share a slot on a wide screen; a selection wins, because it is the thing you just
  // pointed at
  if(id) closeFindings();
  sel=(id&&sel===id)?null:id;
  if(sel) record(sel); else drawPath();
  hover=null;                      // a selection replaces the hover, never stacks on it
  if(sel){ detail(sel); closeResults(); } else $('detail').classList.remove('on');
  apply(); gutters();
  if(typeof syncClear==='function') syncClear();
  if(sel) frameSelection(sel); else unframe();
}

/* ------------------------------------------------------------------ predictive search */
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function hl(id,q){ const i=nrm(id).indexOf(q);
  return i<0?esc(id):esc(id.slice(0,i))+'<mark>'+esc(id.slice(i,i+q.length))+'</mark>'+esc(id.slice(i+q.length)); }
function closeResults(){ $('results').classList.remove('on');
  $('q').setAttribute('aria-expanded','false'); cur=-1; }
function search(){
  const q=nrm(query); res=[];
  if(!q){ hits=null; closeResults(); apply(); return; }
  const pool=[ANCHOR].concat(N.filter(visible));
  const all=pool.map(n=>({n,s:score(n,q)})).filter(o=>o.s>=0)
    .sort((a,b)=>a.s-b.s||a.n.id.localeCompare(b.n.id)).map(o=>o.n);
  hits=new Set(all.map(n=>n.id));      // the map lights all of them
  res=all.slice(0,14);                 // the list shows the first screenful
  const box=$('results');
  box.innerHTML=res.length?res.map((n,i)=>{
    const st=statusOf(n), c=n.ring?colourOf(n):'--amber';
    return `<div class="res" role="option" data-id="${n.id}" data-i="${i}">
      <i class="${st==='missing'?'hollow':''}" style="background:var(${c})"></i>
      <span class="n">${hl(n.id,q)}</span>
      <span class="p">${(PHASES[n.phase]||'anchor').split('·')[0].trim()}</span></div>`;
  }).join('')+(all.length>res.length
      ?`<div class="res none">+${all.length-res.length} more, all lit on the map</div>`:'')
    :`<div class="res none">No skill matches “${esc(query)}”.</div>`;
  box.classList.add('on'); $('q').setAttribute('aria-expanded','true');
  box.querySelectorAll('.res[data-id]').forEach(el=>{
    el.onclick=()=>{ $('q').value=el.dataset.id; query=el.dataset.id; search(); select(el.dataset.id); };
    el.onpointerenter=()=>{ cur=+el.dataset.i; mark(); }; });
  cur=res.length?0:-1; mark(); apply();
}
const mark=()=>$('results').querySelectorAll('.res').forEach((e,i)=>e.classList.toggle('cur',i===cur));

/* ------------------------------------------------------------------ events */

/* pointerleave is not enough on a map that moves. A node sliding out from under a
   stationary cursor fires no leave event, so `hover` got stuck on whatever happened to
   be there when the graph last settled — the name stayed lit over empty space. Every
   frame that moves anything re-checks the hovered node against the real cursor. */
let ptr={x:-1e4,y:-1e4};
function validateHover(){
  if(!hover) return;
  const n = hover===ANCHOR.id ? {sx:CX,sy:CY,srad:21} : N[IDX[hover]];
  if(!n||n.sx===undefined) { hover=null; return; }
  if(Math.hypot(n.sx-ptr.x,n.sy-ptr.y) > Math.max(n.srad||0,7*zoom)+6){ hover=null; apply(); }
}

function bind(el,id){
  // the first click on any node is what stops the drift and settles the map
  el.addEventListener('click',e=>{e.stopPropagation();
    if(orbiting){ unpack(id); return; }
    if(!settled) return;            // still landing
    select(id);});
  el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();
    if(orbiting){ unpack(id); return; } if(settled) select(id); } });
  // Leaving always clears, whether or not something is selected. The old guard meant a
  // node hovered before a selection stayed "hovered" for good, so its name hung on the
  // map with nothing under it and the highlight looked arbitrary.
  el.addEventListener('focus',()=>{ if(!sel&&settled&&!orbiting){hover=id;apply();} });
  el.addEventListener('blur',()=>{ if(hover===id){hover=null;apply();} });
  el.addEventListener('pointerenter',()=>{ if(!sel&&settled&&!orbiting){hover=id;apply();} });
  el.addEventListener('pointerleave',()=>{ if(hover===id){hover=null;apply();} });
}
N.forEach((n,i)=>{ bind(nodeEl[i],n.id);
  nodeEl[i].addEventListener('pointerdown',ev=>{ ev.preventDefault(); drag=n;
    nodeEl[i].setPointerCapture(ev.pointerId); reheat(.3); }); });
bind(gA,ANCHOR.id);

svg.addEventListener('pointermove',ev=>{
  const r=svg.getBoundingClientRect();
  ptr.x=(ev.clientX-r.left)/r.width*W; ptr.y=(ev.clientY-r.top)/r.height*H;
  if(!drag)return;
  drag.x=toWorldX(ptr.x); drag.y=toWorldY(ptr.y); drag.vx=drag.vy=0; paint(); });
svg.addEventListener('pointerleave',()=>{ ptr={x:-1e4,y:-1e4};
  if(hover){ hover=null; apply(); } });
addEventListener('pointerup',()=>{ if(drag){drag=null;reheat(.28);} });

/* ---- navigating a thousand nodes ---------------------------------------------------
   Wheel zooms toward the cursor, so the thing you are pointing at stays under the
   pointer. Dragging empty space pans. Neither touches the layout: the world transform
   is presentation only, which is why labels and strokes keep their screen sizes and the
   physics never has to know the view moved. */
const ZMIN=.55, ZMAX=9;
function zoomAt(sx,sy,factor){
  const z=clampZoom(Math.max(ZMIN,Math.min(ZMAX,zoom*factor)));
  if(z===zoom) return;
  panX = sx-(sx-panX)*(z/zoom);
  panY = FLAT() ? centreY(z) : sy-(sy-panY)*(z/zoom);
  zoom = z; userZoomed=true; autoFrom=null;
  if(FLAT()) panX=clampPanX(panX);
  applyView(); paint(); kick(); updateZoomLabel();
}
svg.addEventListener('wheel',ev=>{
  ev.preventDefault();
  arm();
  // A board and a row have one axis. Zooming them changes nothing you wanted to see and
  // takes away everything either side, so the wheel scrolls along instead — which is the
  // gesture the shape asks for. Either axis of the wheel drives it, so a trackpad swipe
  // and a mouse wheel both work.
  if(FLAT()){
    const d=Math.abs(ev.deltaX)>Math.abs(ev.deltaY)?ev.deltaX:ev.deltaY;
    panX=clampPanX(panX-d*(ev.deltaMode===1?16:1)*0.9);
    applyView(); paint(); kick();
    return;
  }
  const r=svg.getBoundingClientRect();
  zoomAt((ev.clientX-r.left)/r.width*W,(ev.clientY-r.top)/r.height*H,
         Math.pow(.9988, ev.deltaMode===1?ev.deltaY*16:ev.deltaY));
},{passive:false});

let panning=null, panMoved=0;   // survives pointerup so the click after a drag can be ignored
svg.addEventListener('contextmenu',ev=>ev.preventDefault());
svg.addEventListener('pointerdown',ev=>{
  if(ev.button!==0) return;                            // panning is a left-drag only
  // A press that starts on something interactive is not the start of a pan. This has to be
  // checked here rather than on the click, because starting a pan calls setPointerCapture,
  // and from that moment every pointer event — including the click — is delivered to the
  // canvas instead of the thing under the finger. The heading never saw its own press.
  if(drag||ev.target.closest('g.node')||ev.target.closest('.hdhit')) return;
  panning={x:ev.clientX,y:ev.clientY,px:panX,py:panY,moved:0}; panMoved=0;
  svg.setPointerCapture(ev.pointerId); svg.style.cursor='grabbing';
});
svg.addEventListener('pointermove',ev=>{
  if(!panning) return;
  const r=svg.getBoundingClientRect(), u=W/r.width;
  panX=clampPanX(panning.px+(ev.clientX-panning.x)*u);
  // A board and a row are horizontal things: they are laid out to fit the height exactly,
  // so any vertical pan can only take them off the top or bottom of the frame. Dragging
  // one sideways is the gesture; dragging it up and down only ever loses it.
  if(!FLAT()) panY=panning.py+(ev.clientY-panning.y)*u;
  panning.moved=Math.max(panning.moved,Math.abs(ev.clientX-panning.x)+Math.abs(ev.clientY-panning.y));
  applyView(); paint(); kick();
});
addEventListener('pointerup',()=>{ if(panning){ svg.style.cursor=''; panMoved=panning.moved; panning=null; } });

function resetView(){ userZoomed=false; autoFrom=null; setView(1,0,0,true); }

/* ---- framing a selection ------------------------------------------------------------
   Measured: at 100% the median gap between neighbouring nodes is 10px and a label row
   needs 16, so half the map cannot be named where it sits. No amount of spreading fixes
   that without a map three times the viewport. Framing does: at 4-6x the same neighbours
   are 40-60px apart and every label sits where it belongs, unmoved.

   If you have set a zoom level yourself, that is a decision — clicking a node then pans
   to it and leaves the level alone. */
let userZoomed=false, autoFrom=null, vraf=null;
function setView(z,px,py,animate){
  const z0=zoom,x0=panX,y0=panY, z1=clampZoom(Math.max(ZMIN,Math.min(ZMAX,z)));
  if(FLAT()){ py=centreY(z1); px=clampPanX(px,z1); }
  if(!animate){ zoom=z1; panX=px; panY=py; applyView(); paint(); kick(); updateZoomLabel(); return; }
  if(vraf) cancelAnimationFrame(vraf);
  const t0=performance.now(), D=420;
  const step=()=>{ const k=Math.min(1,(performance.now()-t0)/D);
    const e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    zoom=z0+(z1-z0)*e; panX=x0+(px-x0)*e; panY=y0+(py-y0)*e;
    applyView(); paint(); updateZoomLabel();
    vraf = k<1 ? requestAnimationFrame(step) : null;
    if(k>=1) kick(); };
  vraf=requestAnimationFrame(step);
}
function frameSelection(id){
  if(orbiting) return;
  /* A flat view frames its selection too, but along one axis. It zooms until the names are
     comfortably readable, tracks sideways to put the selected node in the middle, and holds
     the vertical centre — so the row or the columns stay where they were and only the scale
     and the sideways position change. The zoom is still bounded by the layout's own height,
     which is what stops it throwing the rest of the board off the frame. */
  if(FLAT()){
    // The flow view holds still. Its whole subject is the journey from the left field to the
    // right-hand total, and zooming to the node throws the destination off the frame — you
    // select a skill to see where it lands and the landing is what leaves. The ribbon
    // lighting up while everything else dims is the framing here.
    if(VIEW==='flow') return;
    const n=IDX[id]!==undefined?N[IDX[id]]:null;
    if(!n) return;
    if(!autoFrom) autoFrom={zoom,panX,panY};
    const z=clampZoom(FRAMEZ);
    // Left of centre, not centred. A name is drawn on whichever side has room, and a node
    // sitting exactly in the middle gets a right-anchored one that runs at the panel. Put it
    // at 38% of the strip and the name has the whole right-hand half to lie in.
    const aim=SAFE_L+(SAFE_R-SAFE_L)*0.38;
    setView(z, clampPanX(aim-n.x*z, z), centreY(z), true);
    return;
  }
  // Selecting the root frames the organisation ring — the surfaces the enterprise root
  // actually owns. It used to light repository instructions too: a hundred nodes in the
  // two densest bands, which cannot carry names at any zoom that still shows them all.
  const ids = id===ANCHOR.id
    ? N.filter(n=>n.ring==='org').map(n=>n.id)
    : (IDX[id]===undefined ? [] : [id,...(neigh[id]||[])].filter(i=>IDX[i]!==undefined));
  if(!ids.length) return;
  const pts=ids.map(i=>N[IDX[i]]);
  const cx=pts.reduce((a,n)=>a+n.x,0)/pts.length, cy=pts.reduce((a,n)=>a+n.y,0)/pts.length;
  const keepY = FLAT() ? panY : null;             // flat views hold their vertical centre
  if(userZoomed){                                  // your zoom level, your call
    setView(zoom,(SAFE_L+SAFE_R)/2-cx*zoom,keepY!==null?keepY:CY-cy*zoom,true); return; }
  // otherwise fit the selection and its overlaps into the space the panel leaves
  const spread=Math.max(40,...pts.map(n=>Math.hypot(n.x-cx,n.y-cy)));
  // Frame tightly. A selection framed to 62% of the screen left sixteen organisation
  // nodes spanning 165 units of height, and sixteen label rows need 195 — so most of them
  // were withdrawn for want of somewhere to sit. The frame has to give the labels room,
  // not just get the nodes on screen.
  const availW=(SAFE_R-SAFE_L)*.86, availH=H*.86;
  const rows=Math.max(2,ids.length);
  const needH=rows*LBLH*1.15;                       // the stack the labels will want
  const z=Math.max(1.6,Math.min(7.5,
    Math.max(Math.min(availW,availH)/(spread*2+40), needH/Math.max(40,spread*2))));
  if(!autoFrom) autoFrom={zoom,panX,panY};
  // In a flat view the zoom changes but the vertical centre does not: the whole layout is
  // one band, so recentring on a node's y only pushes the rest of the band off the frame.
  // Whatever world-y is at the middle of the screen right now stays there through the zoom.
  const midY=(CY-panY)/zoom;
  setView(z,clampPanX((SAFE_L+SAFE_R)/2-cx*z),FLAT()?CY-midY*z:CY-cy*z,true);
}
// Deselecting goes back to the default view rather than to wherever the last frame left
// you — after two or three selections "where I was" is not a place anyone remembers.
function unframe(){ autoFrom=null;
  if(userZoomed) return;                       // unless you set the zoom yourself
  if(zoom!==1||panX!==0||panY!==0) setView(1,0,0,true); }
function updateZoomLabel(){ if(!$('zlabel')) return; const b=$('zlabel'); if(b) b.textContent=Math.round(zoom*100)+'%'; }
// reaching for any control is a decision to stop watching and start using it
function arm(){ if(orbiting){ startSettle(null); return true; } return false; }

addEventListener('keydown',e=>{
  if(document.activeElement===$('q')) return;
  if(e.key==='+'||e.key==='=') zoomAt(CX,CY,1.35);
  if(e.key==='-') zoomAt(CX,CY,1/1.35);
  if(e.key==='0') resetView();
});
updateZoomLabel();
// the first click anywhere on the map lays the rings out, not only a click on a node
// Clicking off is the way out, and it goes all the way out — deselect and back to the
// default view in one move, whether you got here by selecting a node or by zooming
// yourself. Anything less means remembering which of the two put you where you are.
svg.addEventListener('click',()=>{ if(panMoved>4){ panMoved=0; return; }
  if(orbiting){
    // The node you aimed at has moved by the time the click lands, so take the nearest one
    // to where the pointer actually was. It is not opened now — nothing opens until the
    // field has come to rest — it is remembered and applied the moment it does.
    let best=null,bd=16*16;
    for(const n of N){ const d=(n.x-ptr.x)**2+(n.y-ptr.y)**2; if(d<bd){bd=d;best=n;} }
    startSettle(best?best.id:null);
    return; }
  if(!settled) return;                       // the field is still landing
  closeResults();
  // Clicking away clears what is lit, whichever way it got lit. A destination picked by
  // clicking it behaved differently from a node selected by clicking it — one cleared on a
  // background click and the other did not — and nothing on screen said why.
  const had=clearPicks(); if(had){ syncClear(); }
  if(sel) select(null); else if(had){ apply(); kick(); }
  // Clicking the background used to snap the view back to where it started. On a board you
  // have scrolled halfway along, that throws away the thing you were looking at to undo a
  // selection — two different intentions on one gesture. Deselect only; where you have
  // scrolled to is yours, and Reset is there when you want it back.
  if(!FLAT()) resetView(); });

/* Every entry in the key is a selector, and selecting shows you a group rather than
   removing it. Clicking "always-on" used to hide the always-on nodes, which is the
   opposite of what the gesture reads as — you point at a thing to see it. Clicking a tag
   inside a description was fixed to light its nodes some time ago and the key was left
   behind, so the same click meant two opposite things depending on where you made it.

   One rule now, everywhere: click to light the group, click again to release it. Several
   can be lit at once and they add. Nothing in the key removes a node from the map — what
   you did not pick recedes, so you keep the context you are picking out of. */
const PICKS=new Set();
const pickMatch={
  agent:      n=>n.agent,
  settled:    n=>settledOf(n),
  unverified: n=>EVIDENCE[n.id]==='named',
  flag:       n=>n.flag,
  // "available" has to mean the same thing here as in the number beside it. The counter was
  // made honest — it stopped counting a skill as available on the strength of a document
  // naming it — and this predicate was left on the old status field, so the chip said 28
  // and lit 62.
  present:    n=>statusOf(n)==='present'&&EVIDENCE[n.id]!=='named',
  missing:    n=>statusOf(n)==='missing',
  never:      n=>statusOf(n)==='never'
};
// null when nothing is picked, which is what tells apply() to leave the map alone
/* Pointing at a destination or a build step previews it: the same set lights that clicking
   would pick, and it goes again when you point elsewhere. A total you cannot interrogate
   without committing to a click is a number you have to trust; one you can sweep along is a
   number you can check. It is a separate channel from PICKS on purpose — a preview must not
   survive the pointer leaving, and a pick must not die because it did. */
let hoverPick=null;
function idsForKeys(keys){
  const rings=keys.filter(k=>k.startsWith('r:')).map(k=>k.slice(2));
  const grps =keys.filter(k=>k.startsWith('g:')).map(k=>k.slice(2));
  const kinds=keys.filter(k=>!k.startsWith('r:')&&!k.startsWith('g:'));
  const out=new Set();
  for(const n of N)
    if(rings.includes(n.ring) || grps.includes(groupOf(n))
       || kinds.some(k=>pickMatch[k]&&pickMatch[k](n))) out.add(n.id);
  return out;
}
function pickedIds(){
  const keys=[...PICKS]; if(hoverPick) keys.push(hoverPick);
  return keys.length ? idsForKeys(keys) : null;
}
function clearPicks(){
  if(!PICKS.size) return false;
  PICKS.clear();
  document.querySelectorAll('.pick').forEach(el=>{
    el.classList.remove('pick'); el.setAttribute('aria-checked','false'); });
  return true;
}
/* Pointing at it shows what clicking it would pick, and stops showing it when you point
   away — including on focus, so a keyboard finds the same thing a pointer does. */
function previewable(el,key,brighten){
  const on=v=>{ hoverPick=v?key:(hoverPick===key?null:hoverPick);
                for(const e of brighten) e.style.opacity=v?1:'';
                el.style.cursor='pointer'; apply(); kick(); };
  el.addEventListener('pointerenter',()=>on(true));
  el.addEventListener('pointerleave',()=>on(false));
  el.addEventListener('focus',()=>on(true));
  el.addEventListener('blur',()=>on(false));
}
function pickable(el,key){
  el.tabIndex=0; el.setAttribute('role','switch'); el.setAttribute('aria-checked','false');
  const hit=()=>{ arm();
    PICKS.has(key)?PICKS.delete(key):PICKS.add(key);
    el.classList.toggle('pick',PICKS.has(key));
    el.setAttribute('aria-checked',PICKS.has(key)?'true':'false');
    $('pickclear').classList.toggle('on',PICKS.size>0);
    apply(); kick(); };
  el.onclick=e=>{ e.stopPropagation(); hit(); };
  el.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); hit(); } };
}
document.querySelectorAll('[data-f]').forEach(el=>pickable(el,el.dataset.f));
pickable($('k-flag'),'flag');
/* and it opens the panel on what it just lit. Lighting a dot and naming a count answers
   "how many"; it does not answer "which, and what is wrong with it", which is the only
   reason anyone clicks a row labelled open items. */
$('k-flag').addEventListener('click',()=>{
  if(PICKS.has('flag')) openFindings('open'); else closeFindings(); });
document.querySelectorAll('.ringkey [data-r],.ringkey [data-k]').forEach(el=>
  pickable(el, el.dataset.r?'r:'+el.dataset.r:el.dataset.k));
/* One control that puts the map back to all of it, and one key that does the same.

   The trap it fixes: clicking a related skill inside an open description selects that node,
   and if the node it selected is off screen there was nothing on screen to press to undo it.
   Clicking empty space works only if you can find empty space, which on a zoomed-in board or
   a dense ring you cannot. So the button is visible whenever ANYTHING is narrowing the map —
   a selection, a pick or a search — not only when a pick is on, and it says what it will do. */
function anythingOn(){ return PICKS.size>0 || !!hoverPick || !!query || !!sel; }
function syncClear(){
  const b=$('pickclear'), on=anythingOn();
  b.classList.toggle('on',on);
  b.textContent = sel && !PICKS.size && !query
    ? 'Deselect '+(sel.length>22?sel.slice(0,21)+'…':sel)
    : 'Show everything again';
}
function clearAll(){
  const had=anythingOn();
  clearPicks();
  if(sel) select(null);
  if(query) clearFilter(); else { apply(); kick(); }
  syncClear();
  return had;
}
$('pickclear').onclick=e=>{ e.stopPropagation(); arm(); clearAll(); };

/* ---- the opening comes back after ten minutes ------------------------------------------
   A map left open on a second screen stops being a picture of anything: whatever was
   selected an hour ago is still lit, at whatever zoom, and it reads as the current state
   because nothing says otherwise. So after ten idle minutes it puts itself back — the drift,
   the trails, the radial layout, nothing selected — which is both the honest state and the
   one worth glancing at.

   Only ever from idle. Any pointer, key, wheel or touch resets the clock, so this cannot
   interrupt someone who is using it; and if the tab is in the background the restart waits
   until it is looked at again rather than animating to nobody. */
const IDLE_MS=10*60*1000;
let lastActive=performance.now();
const noteActive=()=>{ lastActive=performance.now(); };
for(const ev of ['pointerdown','pointermove','wheel','keydown','touchstart'])
  addEventListener(ev,noteActive,{passive:true});
addEventListener('visibilitychange',()=>{ if(!document.hidden) noteActive(); });

function restartOpening(){
  if(orbiting) return;
  if(vraf){ cancelAnimationFrame(vraf); vraf=null; }
  clearPicks(); if(query) clearFilter();
  if(sel) select(null);
  closeResults(); syncClear();
  visited=[]; drawPath();
  if(VIEW!=='radial') setLayout('radial');
  // back to the state the page loads in, not to whatever the last view left behind
  userZoomed=false; autoFrom=null; pending=null;
  zoom=1; panX=0; panY=0; applyView();
  orbiting=true; settled=true;
  svg.classList.remove('settling'); svg.classList.add('orbiting');
  tcv.style.opacity=''; sparks.length=0;
  rings(); deco(); orbitHomes(); orbitPlace();
  alpha=0; if(!raf) raf=requestAnimationFrame(tick);
}
// Checked once a minute rather than scheduled for the exact moment: a timer set ten minutes
// out is wrong the instant anything happens, and a machine that slept through the interval
// should notice on waking rather than having missed its one chance to fire.
setInterval(()=>{
  if(document.hidden || orbiting) return;
  if(performance.now()-lastActive>=IDLE_MS) restartOpening();
},60*1000);
// Escape does exactly what the button does, from anywhere, including out of the search box.
// It could instead unwind one step at a time — close the results, then drop the search, then
// the picks — but an escape hatch you have to press four times is not one, and both routes
// end at the same map anyway.
addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if(!$('findings').hidden){ closeFindings(); e.preventDefault(); return; }
  if(document.activeElement===$('q')) $('q').blur();
  if(clearAll()) e.preventDefault();
});

/* A static page cannot check anything when you open it — everything it knows was baked in
   at build time. So it has to say when that was, or it will be trusted for longer than it
   has earned. Past a month it says so in amber rather than quietly. */
{ const built=Math.round((Date.now()-Date.parse(BUILT))/86400000);
  const stale=built>30;
  // The scan was how the library got checked before it was pushed. Now the repo is read
  // directly, so it is only worth mentioning when one exists.
  const scan = SCAN_AT
    ? ` \u00b7 scan ${Math.round((Date.now()-Date.parse(SCAN_AT))/86400000)}d old` : '';
  const clock = CLOCK==='git' ? 'dates from git'
    : CLOCK==='manifest' ? 'dates from the account manifest'
    : `<span class="warn">no date source \u2014 nothing tagged new</span>`;
  const unver = N.filter(n=>EVIDENCE[n.id]==='named').length;
  $('stamp').innerHTML =
    `built <b>${BUILT}</b>${stale?` <span class="warn">(${built}d ago)</span>`:''}${scan}<br>`
    + `${clock} \u00b7 `
    + (unver ? `<span class="warn">${unver} unverified</span>` : 'every skill read from the library')
    + (GONE.length?` \u00b7 <span class="warn">${GONE.length} gone from the library</span>`:'');
}

{ const menu=$('viewmenu');
  for(const [k,v] of Object.entries(VIEWS)){
    const b=document.createElement('button');
    b.dataset.v=k; b.className=k===VIEW?'on':'';
    b.innerHTML=v.name+'<i>'+v.hint+'</i>';
    b.onclick=e=>{ e.stopPropagation(); arm(); setLayout(k); };
    menu.appendChild(b);
  }
}

/* "Copy all 0 fixes, in order" is not a sentence, and a brief with nothing in it is not worth
   copying. When the list empties the button stops offering the brief and reports the state
   instead — which is the answer to the question the panel exists to ask. */
drawFindings();
$('findbtn').onclick=e=>{ e.stopPropagation(); arm();
  $('findings').hidden ? openFindings() : closeFindings(); };

if(FIXCOUNT){
  $('k-f2').textContent=FIXCOUNT;
  // One brief, in one place. This used to copy a second one written in the imperative — a
  // different text from the panel's, telling the reader to start work rather than to check
  // the premise first. Two briefs that disagree about what is being asked is worse than one
  // button fewer.
  $('fixall').textContent='Read the '+FIXCOUNT+(FIXCOUNT===1?' open item':' open items');
  // and light them on the map while it reads, which is what the row above it does and what
  // clicking a tag does. Reading the finding and seeing which node it is about are the same
  // question asked twice; making them two clicks made the button look like it had done
  // nothing to the map.
  $('fixall').onclick=e=>{ e.stopPropagation(); arm();
    if(!PICKS.has('flag')) $('k-flag').click(); else openFindings('open'); };
  $('demoflag').textContent=
    'The library was read at build time — this is what is on your machine, not a sample.';
}else{
  // Nothing open, so the whole card goes: the count is zero, the filter it toggles would
  // select nothing, and the button has no brief to copy. A panel whose only content is the
  // news that it has no content is worse than no panel. The settled work is not lost — every
  // node still carries its finding, and the green dashed ring still marks which ones had one.
  $('key3').hidden=true;
}


// tooltips: one node, positioned left of the panel so it never covers what it explains
{ const tipEl=$('tip'); let tHide;
  const show=el=>{ clearTimeout(tHide);
    tipEl.innerHTML=el.dataset.tip;
    const r=el.getBoundingClientRect();
    tipEl.style.right=(innerWidth-r.left+12)+'px';
    tipEl.style.top='0px'; tipEl.classList.add('on');
    const h=tipEl.getBoundingClientRect().height;
    tipEl.style.top=Math.max(12,Math.min(innerHeight-h-12,r.top+r.height/2-h/2))+'px'; };
  const hide=()=>{ tHide=setTimeout(()=>tipEl.classList.remove('on'),60); };
  document.querySelectorAll('[data-tip]').forEach(el=>{
    el.addEventListener('click',e=>e.stopPropagation());
    el.addEventListener('pointerenter',()=>show(el));
    el.addEventListener('pointerleave',hide);
    el.addEventListener('focus',()=>show(el));
    el.addEventListener('blur',hide);
  });
}

function runTag(t){ $('q').value=t; query=t; search(); $('capsel').value=t; closeResults(); }
function clearFilter(){ $('q').value=''; query=''; hits=null; $('capsel').value='';
  if(typeof syncClear==='function') setTimeout(syncClear,0);
  document.querySelectorAll('#detail [data-tag]').forEach(o=>o.classList.remove('on'));
  closeResults(); apply(); }
$('qclear').onclick=e=>{ e.stopPropagation(); arm(); clearFilter(); $('q').focus(); };
{ const counts={};
  N.forEach(n=>n.tags.forEach(t=>counts[t]=(counts[t]||0)+1));
  $('capsel').innerHTML='<option value="">Filter by capability…</option>'+
    Object.keys(counts).sort().map(t=>
      `<option value="${t}">${t} — ${counts[t]}</option>`).join('');
  $('capsel').onchange=e=>{ arm(); const t=e.target.value;
    if(t) runTag(t); else { $('q').value=''; query=''; hits=null; apply(); } };

  // the control that set this is gone; colourMode stays at its default, which is by ring
}

const qi=$('q');
let deb; qi.oninput=e=>{ arm(); query=e.target.value.trim(); syncClear();
  clearTimeout(deb); deb=setTimeout(search,50); };
qi.onfocus=()=>{ if(query)search(); };
qi.onkeydown=e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); if(!res.length)return;
    cur=(cur+(e.key==='ArrowDown'?1:-1)+res.length)%res.length; mark();
    const el=$('results').querySelectorAll('.res')[cur]; if(el)el.scrollIntoView({block:'nearest'}); }
  else if(e.key==='Enter'&&cur>=0&&res[cur]){ e.preventDefault();
    qi.value=res[cur].id; query=res[cur].id; search(); select(res[cur].id); qi.blur(); }
  else if(e.key==='Escape'){ qi.value='';query='';res=[];hits=null;
    closeResults();apply();qi.blur(); }
};
addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==qi){ e.preventDefault(); qi.focus(); qi.select(); }
  if(e.key==='Escape'&&document.activeElement!==qi){
    qi.value='';query='';res=[];hits=null;
    closeResults();select(null);hover=null;apply();resetView(); } });
addEventListener('pointerdown',e=>{ if(!$('panel').contains(e.target)) closeResults(); });
let rz; addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(resize,120); });

resize();
// The ring layout is converged off-screen so it is static the moment it is revealed.
// The orbiting layout needs none of this — the spiral already places every node.

alpha=0; paint(); apply();
</script>
