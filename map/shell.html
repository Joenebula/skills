<title>Meridian — Copilot Enterprise map (demo)</title>
<style>
  :root{
    --void:#05070E; --void2:#0B0F1C;
    --ink:#E8EDF8; --ink2:#9AA6C4; --ink3:#5C6788;
    --amber:#F2A03C; --present:#6EE7A8; --missing:#FF6B5E; --never:#5E6B8C;
    --overlap:#E879C7; --bind:#F2A03C; --phase:#7A6FD8;
    --r1:#F2A03C; --r2:#A78BFA; --r3:#5EC8F0; --r4:#4E7BE8; --r5:#3E9C8F;
    --edge:rgba(140,170,235,.30); --edge2:rgba(140,170,235,.16);
    --ease:cubic-bezier(.32,.72,.28,1);
    --font:'Roboto','Roboto Flex','Helvetica Neue',system-ui,-apple-system,sans-serif;
    --mono:'Roboto Mono',ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--void)}
  body{color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;
       -webkit-font-smoothing:antialiased}
  #viz{display:block;width:100vw;height:100vh}
  /* trails live on a canvas behind the map: decorative, non-interactive, and far too many
     shapes a second for SVG to carry */
  #bgviz{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
  #trailcv{position:fixed;inset:0;width:100vw;height:100vh;z-index:1;pointer-events:none;
    transition:opacity .62s var(--ease)}
  #viz{position:relative;z-index:2;background:transparent}

  #tip{position:fixed;z-index:60;max-width:330px;padding:12px 14px;font-size:13px;
    line-height:1.55;color:var(--ink2);opacity:0;pointer-events:none;
    transform:translateX(6px);transition:opacity .14s,transform .14s}
  #tip.on{opacity:1;transform:none}
  #tip b{color:var(--ink);font-weight:600}
  #tip br{content:"";display:block;margin-bottom:4px}
  #tip code{font-family:var(--mono);font-size:12px;color:var(--r3)}
  @media(max-width:820px){#tip{display:none}}

  /* ---------- right column: search → key → detail ---------- */
  #panel{position:fixed;top:18px;right:18px;width:450px;z-index:10;
    max-height:calc(100vh - 36px);display:flex;flex-direction:column;gap:10px}
  @media(max-width:820px){#panel{left:12px;right:12px;top:12px;width:auto}}
  .card{background:rgba(8,12,24,.80);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-radius:13px;box-shadow:0 0 0 1px var(--edge2),0 16px 46px rgba(0,0,0,.6)}

  /* backdrop-filter on .sbox makes it a stacking context, so #results was trapped inside
     it however high its own z-index went, and the cards below painted over the suggestions.
     The box itself has to outrank its siblings. */
  /* No outline round either control at rest. The search box carried a 1.4px ring at --edge
     while every card beside it had 1px at --edge2 — nearly twice the weight at twice the
     opacity, so the one thing on the panel that should sit quietly was the loudest. Both it
     and the capability filter now separate by ground rather than by line, which is the rule
     Joe's own design skill states: no outline borders on containers.

     Focus is a different question and still shows: the edge lights from the inside, which
     says "this has the keyboard" without drawing a box round it. */
  .sbox{position:relative;z-index:40;flex:none;
    box-shadow:0 16px 46px rgba(0,0,0,.6);
    background:rgba(140,170,235,.05);transition:box-shadow .18s,background .18s}
  .sbox:focus-within{box-shadow:inset 0 0 0 1px rgba(94,200,240,.42),
    0 16px 46px rgba(0,0,0,.6);background:rgba(94,200,240,.07)}
  .sbox>svg{position:absolute;left:15px;top:15px;width:15px;height:15px;
    stroke:var(--ink3);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none;
    transition:stroke .18s}
  .sbox:focus-within>svg{stroke:var(--r3)}
  #q{width:100%;border:0;outline:0;font-family:inherit;font-size:15px;color:var(--ink);
     background:transparent;padding:13px 66px 13px 41px;border-radius:13px;letter-spacing:.01em}
  #q::placeholder{color:var(--ink3)}
  #q::-webkit-search-cancel-button{display:none}
  .kbd{position:absolute;right:14px;top:15px;font-family:var(--mono);font-size:13px;
    color:var(--ink3);background:rgba(140,170,235,.10);padding:3px 6px;border-radius:5px;
    pointer-events:none}
  #q:not(:placeholder-shown)~.kbd{display:none}
  /* A tag clicked inside a description could only be un-clicked from that same
     description, so closing the panel stranded the filter with no way out. This is
     always reachable while a filter is on. */
  #qclear{display:none;position:absolute;right:10px;top:9px;appearance:none;border:0;
    cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;padding:6px 10px;
    border-radius:8px;background:rgba(94,200,240,.16);color:var(--r3);
    transition:background .16s var(--ease),color .16s var(--ease)}
  #qclear:hover{background:var(--r3);color:var(--void)}
  #q:not(:placeholder-shown)~#qclear{display:block}

  /* results overlay the column so nothing below jumps */
  /* opaque, not translucent: it now floats over the key cards, and blurring them behind
     it does not happen — they sit in their own stacking contexts, so they showed through
     the glass sharp enough to read the suggestions through */
  #results{background:#0A0E1A;box-shadow:0 0 0 1px var(--edge2),0 20px 54px rgba(0,0,0,.75);
    position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:30;display:none;
    max-height:min(52vh,430px);overflow-y:auto;padding:5px}
  #results.on{display:block;animation:drop .24s var(--ease)}
  @keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .res{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;
    cursor:pointer;transition:background .12s}
  .res:hover,.res.cur{background:rgba(140,170,235,.14)}
  .res i{width:7px;height:7px;border-radius:50%;flex:none}
  .res i.hollow{background:transparent!important;box-shadow:inset 0 0 0 1.5px var(--missing)}
  .res .n{font-size:14px;font-weight:500;flex:1;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .res .n mark{background:transparent;color:var(--amber);font-weight:700}
  .res .p{font-size:13px;color:var(--ink3);white-space:nowrap;font-weight:500;
    letter-spacing:.01em}
  .res.none{color:var(--ink3);font-size:13px;padding:13px 11px;cursor:default}
  .res.none:hover{background:transparent}

  /* ---------- key ---------- */
  #capsel{flex:none;appearance:none;border:0;outline:0;cursor:pointer;width:100%;
    font-family:inherit;font-size:13px;color:var(--ink2);padding:11px 14px;border-radius:13px;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),
      linear-gradient(135deg,var(--ink3) 50%,transparent 50%);
    background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  /* A full cyan ring stayed drawn around the control after every click and read as an error
     state on something that was working. :focus-visible does not help here — a <select> is
     keyboard-operable, so Chromium matches it on a mouse click too, which is correct and not
     what was wanted. So the ring goes and the affordance moves inward: the control lifts and
     its edge picks up the accent, which says "this one has the keyboard" without drawing a
     halo round it. */
  #capsel{box-shadow:0 16px 46px rgba(0,0,0,.6);background-color:rgba(140,170,235,.05);
    transition:box-shadow .18s,background-color .18s}
  #capsel:focus{box-shadow:inset 0 0 0 1px rgba(94,200,240,.42),0 16px 46px rgba(0,0,0,.6);
    background-color:rgba(94,200,240,.07);color:var(--ink)}
  .selrow{display:flex;align-items:center;gap:8px;flex:none}
  /* The selects set flex:none and width:100% under an ID selector, which outranks any class
     rule — so the row stayed 450 wide and pushed the help button past the edge of the panel.
     Matched by ID here so it actually wins. */
  .selrow #capsel{flex:1 1 0;width:auto;min-width:0}
  .selq{flex:none}
  #capsel option{background:#0B0F1C;color:var(--ink2)}
  /* the key is three cards, not one: what a node's state is, what its ring is,
     and what still needs doing. They read as separate questions, so they sit apart. */
  #key,#key2,#key3{flex:none;padding:16px 18px}
  /* none of the key is prose — it is all controls, and dragging across it used to
     leave a smear of highlighted text. The map labels go the same way, because a
     node drag starts on top of them. The detail panel stays selectable: that is
     where the text you might actually want to copy lives. */
  #key,#key2,#key3,.ringkey,.krow,.krow2,.chip,.kbd,#hint,#capsel{
    -webkit-user-select:none;user-select:none}
  svg text{-webkit-user-select:none;user-select:none}
  #key h3{font-size:13px;letter-spacing:.16em;color:var(--ink3);
    font-weight:700;margin:0 0 10px}
  .krow{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2);
    padding:3.5px 6px;margin:0 -6px;border-radius:6px}
  .krow.tog{cursor:pointer;transition:background .16s var(--ease),color .16s var(--ease)}
  .krow.tog:hover{background:rgba(140,170,235,.14);color:var(--ink)}
  .krow.off{color:var(--ink3);opacity:.4}
  .krow i{width:8px;height:8px;border-radius:50%;flex:none}
  .krow i.hollow{background:transparent!important;box-shadow:inset 0 0 0 1.6px var(--missing)}
  .krow i.solidh{background:transparent!important;box-shadow:inset 0 0 0 1.6px var(--never)}
  .krow i.ln{width:18px;height:2px;border-radius:0}
  .krow b{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink3);font-weight:400}
  .klab{font-size:13px;letter-spacing:.01em;color:var(--ink3);font-weight:600;
    margin-bottom:9px;display:flex;align-items:center}
  .q{appearance:none;border:0;cursor:help;flex:none;margin-left:auto;
    width:18px;height:18px;border-radius:50%;padding:0;text-align:center;
    font-family:inherit;font-size:13px;font-weight:700;line-height:18px;
    background:rgba(140,170,235,.12);color:var(--ink3);
    transition:background .16s var(--ease),color .16s var(--ease)}
  .krow .q{margin-left:9px}
  .q:hover,.q:focus-visible{background:var(--r3);color:var(--void);outline:none}
  .cap{appearance:none;border:0;cursor:pointer;font-family:inherit;font-size:13px;
    font-weight:500;padding:5px 10px;border-radius:6px;background:rgba(140,170,235,.10);
    color:var(--ink2);transition:background .16s var(--ease),color .16s var(--ease)}
  .cap:hover,.cap.on{background:rgba(94,200,240,.22);color:var(--r3)}
  .cap i{font-style:normal;color:var(--ink3);margin-left:5px}
  .cap:hover i,.cap.on i{color:var(--r3);opacity:.7}
  /* Location: the path is the readable part, the URL is not. Show the path, copy the URL,
     and only unfold the URL once someone has asked for it by pressing the button. */
  .d-loc{margin-top:14px}
  .d-loc .lbl{font-size:13px;letter-spacing:.12em;color:var(--ink3);
    font-weight:700;margin-bottom:7px}
  .locrow{display:flex;align-items:flex-start;gap:9px}
  .locpath{flex:1 1 auto;min-width:0;font-family:var(--mono);font-size:13px;line-height:1.5;
    color:var(--ink2);background:rgba(140,170,235,.07);padding:8px 10px;border-radius:7px;
    overflow-wrap:anywhere}
  .locpath b{color:var(--r3);font-weight:600}
  .loccopy{appearance:none;border:0;cursor:pointer;font-family:inherit;font-size:13px;
    font-weight:600;padding:8px 11px;border-radius:7px;flex:none;white-space:nowrap;
    background:rgba(94,200,240,.16);color:var(--r3);transition:background .16s var(--ease),color .16s var(--ease)}
  .loccopy:hover,.loccopy:focus-visible{background:var(--r3);color:var(--void);outline:none}
  .loccopy.ok{background:var(--present);color:var(--void)}
  .locfull{margin-top:8px;font-family:var(--mono);font-size:13px;line-height:1.5;
    color:var(--ink3);background:rgba(4,6,12,.5);padding:8px 10px;border-radius:7px;
    overflow-wrap:anywhere;box-shadow:inset 0 0 0 1px var(--edge2)}
  .locfull[hidden]{display:none}
  .locnote{margin-top:7px;font-size:13px;color:var(--ink3);line-height:1.5}
  .d-tags{margin-top:14px;display:flex;flex-wrap:wrap;gap:7px}
  .d-tags .lbl{flex:0 0 100%}
  .krow2{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .krow2+.krow2{margin-top:10px}
  .chip{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);
    padding:5px 9px;border-radius:7px;background:rgba(140,170,235,.08);white-space:nowrap}
  .chip.tog{cursor:pointer;transition:background .16s var(--ease),color .16s var(--ease)}
  .chip.tog:hover{background:rgba(140,170,235,.2);color:var(--ink)}
  .chip.off{opacity:.35}
  .chip i{width:8px;height:8px;border-radius:50%;flex:none}
  .chip i.hollow{background:transparent!important;box-shadow:inset 0 0 0 1.6px var(--missing)}
  .chip i.solidh{background:transparent!important;box-shadow:inset 0 0 0 1.6px var(--never)}
  .chip i.ln{width:16px;height:2px;border-radius:0}
  .chip b{font-family:var(--mono);font-size:13px;color:var(--ink3);font-weight:400}
  .krow2 .q{margin-left:auto}
  /* One gap value, no negative margins. The pills used to pull -3px vertically, which
     ate most of the row gap and left the space under row one visibly tighter than the
     space under row two — two different bottom margins from one rule. */
  .ringkey{display:flex;flex-wrap:wrap;gap:8px;margin:0;font-size:13px;
    color:var(--ink2)}
  .ringkey span{display:flex;align-items:center;gap:7px}
  .ringkey i{width:8px;height:8px;border-radius:50%;flex:none}
  .ringkey .bycap{display:none}
  .ringkey .q{margin-left:0}
  .ringkey i.dot-agent{background:transparent;box-shadow:none;
    width:12px;height:12px;border:1.5px dotted var(--r3)}
  .ringkey i.dot-done{background:transparent;box-shadow:inset 0 0 0 1.5px var(--present)}
  .ringkey.capmode .byring{display:none}
  .ringkey.capmode .bycap{display:flex}
  /* every ring/kind entry selects a group, so it has to look pressable */
  .ringkey .tog{cursor:pointer;user-select:none;border-radius:7px;padding:5px 9px;margin:0;
    background:rgba(140,170,235,.06);transition:background .16s var(--ease),color .16s var(--ease),box-shadow .16s var(--ease)}
  .ringkey .tog:hover{background:rgba(140,170,235,.2);color:var(--ink)}
  /* Picked reads as lit, because picking lights the map. The old state said the opposite —
     a dimmed chip for the one group you had just asked to look at. */
  .pick{background:rgba(94,200,240,.20)!important;color:var(--r3)!important;
    box-shadow:inset 0 0 0 1.2px rgba(94,200,240,.45)}
  .pick b{color:var(--r3)!important}
  /* one press clears every pick and the search, so there is always a way back to all of it */
  #pickclear{display:none;appearance:none;border:0;cursor:pointer;font-family:inherit;
    font-size:13px;font-weight:600;padding:6px 11px;border-radius:8px;width:100%;
    background:rgba(242,160,60,.16);color:var(--amber);
    transition:background .16s var(--ease),color .16s var(--ease)}
  #pickclear:hover{background:var(--amber);color:var(--void)}
  #pickclear.on{display:block}
  .kdiv{height:1px;background:var(--edge2);margin:11px -18px}
  .demoflag{margin-top:11px;font-size:13px;line-height:1.45;color:var(--amber);
    background:rgba(242,160,60,.10);border-radius:8px;padding:8px 10px;text-align:center}
  .khint{font-size:13px;color:var(--ink3);line-height:1.5;margin-top:2px}

  /* ---------- detail ---------- */
  #detail{flex:0 1 auto;min-height:0;overflow-y:auto;padding:20px 22px;display:none;
    position:relative}
  #detail.on{display:block;animation:drop .3s var(--ease)}
  /* With room for it, a skill gets its own column rather than the bottom of a stack it
     shares with three cards and a session trail. Below that width it goes back to
     stacking, because two 450px columns and a map do not fit. */
  @media(min-width:1400px){
    /* Solid, and only as tall as what is in it. Translucent over a chart that is still
       there — which it now is — leaves the columns reading through the description. */
    #detail{position:fixed;top:18px;right:478px;width:450px;
      max-height:calc(100vh - 36px);height:fit-content;flex:none;
      background:#080C18;backdrop-filter:none;-webkit-backdrop-filter:none;
      box-shadow:0 0 0 1px var(--edge2),0 22px 60px rgba(0,0,0,.72)}
  }
  /* ---------- findings ----------
     Every finding in one place, open and settled alike, in the same slot and the same shape
     as a skill's own panel — because it is the same kind of thing to read. Copying one, or
     all of them, is a button rather than a hunt.

     It takes the detail panel's position on a wide screen and stacks with it below that. Two
     450px columns and a map is the ceiling; a third would not fit. */
  /* Same shape as a layout button: a name, a hint under it, and here a count on the right.
     Set as flex on one line first, which squeezed the hint into three words a line. */
  #findbtn{appearance:none;border:0;cursor:pointer;font-family:inherit;text-align:left;
    padding:9px 11px;width:100%;display:grid;grid-template-columns:1fr auto;
    align-items:baseline;column-gap:8px;
    transition:background .16s var(--ease),color .16s var(--ease)}
  #findbtn:hover,#findbtn.on{background:rgba(94,200,240,.10)}
  #findbtn span{font-size:13.5px;font-weight:600;color:var(--ink2)}
  #findbtn:hover span,#findbtn.on span{color:var(--r3)}
  #findbtn b{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--ink3)}
  #findbtn:hover b,#findbtn.on b{color:var(--r3)}
  #findbtn i{grid-column:1/-1;font-style:normal;font-size:13px;font-weight:400;
    color:var(--ink3);margin-top:1px}
  #findings{flex:0 1 auto;min-height:0;overflow-y:auto;padding:18px 20px;position:relative;
    scrollbar-width:thin;scrollbar-color:rgba(140,170,235,.26) transparent}
  #findings[hidden]{display:none}
  #findings::-webkit-scrollbar{width:9px;background:transparent}
  #findings::-webkit-scrollbar-thumb{background:rgba(140,170,235,.22);border-radius:6px;
    border:2px solid transparent;background-clip:padding-box}
  #findings::-webkit-scrollbar-button{display:none;width:0;height:0}
  @media(min-width:1400px){
    #findings{position:fixed;top:18px;right:478px;width:450px;
      max-height:calc(100vh - 36px);height:fit-content;flex:none;
      background:#080C18;backdrop-filter:none;-webkit-backdrop-filter:none;
      box-shadow:0 0 0 1px var(--edge2),0 22px 60px rgba(0,0,0,.72)}
  }
  .f-head{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;padding-right:24px}
  .f-head h3{margin:0;font-size:16px;font-weight:700;letter-spacing:-.02em}
  .f-head span{font-family:var(--mono);font-size:13px;color:var(--ink3)}
  .f-intro{font-size:13px;color:var(--ink3);line-height:1.55;margin:6px 0 12px}
  .f-tabs{display:flex;gap:6px;margin-bottom:11px}
  .f-tabs button{appearance:none;border:0;cursor:pointer;font-family:inherit;font-size:13px;
    font-weight:600;padding:6px 12px;border-radius:7px;background:rgba(140,170,235,.10);
    color:var(--ink3);transition:background .16s var(--ease),color .16s var(--ease)}
  .f-tabs button:hover{background:rgba(140,170,235,.20);color:var(--ink)}
  .f-tabs button.on{background:rgba(242,160,60,.18);color:var(--amber)}
  .f-all{width:100%;margin-bottom:14px}
  .f-item{padding:13px 0;border-top:1px solid var(--edge2)}
  .f-item:first-of-type{border-top:0}
  .f-top{display:flex;align-items:center;gap:9px;margin-bottom:7px}
  .f-top .n{font-family:var(--mono);font-size:13.5px;font-weight:700;color:var(--ink);
    overflow-wrap:anywhere}
  .f-state{font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 7px;
    border-radius:5px;white-space:nowrap}
  .f-state.done{background:rgba(88,214,141,.16);color:var(--present)}
  .f-state.open{background:rgba(242,160,60,.16);color:var(--amber)}
  .f-copy{margin-left:auto;flex:none}
  .f-body{font-size:13.5px;color:var(--ink2);line-height:1.6;white-space:pre-wrap;
    overflow-wrap:anywhere}
  .f-body b{color:var(--ink);font-weight:600}
  .f-body code{font-family:var(--mono);font-size:12.5px;color:var(--r3)}
  /* the method strip: how this one was reached, each chip a way in to the rule behind it */
  .f-via{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
  .f-via span{font-size:12px;letter-spacing:.06em;color:var(--ink3);font-weight:700;
    margin-right:1px}
  .mchip{appearance:none;border:0;outline:0;cursor:pointer;font-family:inherit;font-size:12px;
    font-weight:600;padding:4px 9px;border-radius:6px;background:rgba(140,170,235,.12);
    color:var(--ink3);transition:background .16s var(--ease),color .16s var(--ease)}
  .mchip:hover,.mchip:focus-visible{background:rgba(94,200,240,.20);color:var(--r3)}
  /* the one that got things wrong twice reads differently at rest, not only when hovered */
  .mchip.weak{background:rgba(242,160,60,.14);color:var(--amber)}
  .mchip.weak:hover,.mchip.weak:focus-visible{background:rgba(242,160,60,.26);color:var(--amber)}
  .f-blind{margin-top:9px;padding:9px 11px;border-radius:8px;font-size:13px;line-height:1.55;
    color:var(--ink3);background:rgba(140,170,235,.06)}
  .f-blind b{color:var(--ink2)}
  .f-knob{margin-top:7px;padding:9px 11px;border-radius:8px;font-size:13px;line-height:1.55;
    color:var(--r3);background:rgba(94,200,240,.07)}
  .f-knob b{color:var(--r3)}

  /* The skill's own frontmatter, quoted. It had no rule of its own, so the label ran straight

  .d-own{margin:14px 0 0;padding:11px 13px;border-radius:8px;
    background:rgba(140,170,235,.06);

  .d-noclock b{color:var(--amber)}
  .d-noclock code{font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
  .d-desc{font-size:14.5px;color:var(--ink2);line-height:1.62}

    color:var(--overlap);margin:0 4px 4px 0;transition:background .16s var(--ease),color .16s var(--ease)}
  .relbtn:hover{background:var(--overlap);color:var(--void)}
  /* An open finding is a warning, and it was reading as a footnote — same greys as the
     description above it, with the only colour on a Copy button. It now carries the amber
     the map already uses for an open item, so the panel tells you there is something wrong
     here before you read a word of it. */
  .d-fix{margin-top:16px;padding:12px 13px 13px;border-radius:10px;
    background:rgba(242,160,60,.07);
    box-shadow:0 0 0 1px rgba(242,160,60,.24)}
  .d-fix .lbl{display:flex;align-items:center;gap:8px;margin-bottom:9px;
    font-size:13px;letter-spacing:.12em;font-weight:700;
    color:var(--amber)}

  .d-fix .basisrow{margin-bottom:9px}
  .d-fix pre{margin:0;font-family:var(--mono);font-size:13px;line-height:1.62;
    color:var(--ink2);background:rgba(4,6,12,.55);padding:11px 12px;border-radius:8px;
    box-shadow:inset 0 0 0 1px rgba(242,160,60,.13);
    white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow-y:auto}
  /* the finding's code block keeps its amber thumb — it is inside an amber panel */
  .d-fix pre{scrollbar-width:thin;scrollbar-color:rgba(242,160,60,.30) transparent}
  .d-fix pre::-webkit-scrollbar{width:9px;background:transparent}
  .d-fix pre::-webkit-scrollbar-thumb{background:rgba(242,160,60,.22);border-radius:5px}
  .d-fix pre::-webkit-scrollbar-button{display:none;width:0;height:0}

  /* Every scrolling area, not just the one code block that happened to have a rule. The
     panel's own bar was the browser default — a full-width white slab with arrow buttons,
     stood next to a dark translucent card, and the brightest object on the page.

     Both syntaxes on purpose, and they are written to agree. scrollbar-width/-color are the
     standard properties; ::-webkit-scrollbar is the older WebKit way and is what a Safari or
     an older Chrome will read. Chrome 121 and later support both and give the standard ones
     precedence — setting scrollbar-color makes it ignore the ::-webkit rules for that
     scroller entirely — so the two must describe the same bar or the result depends on the
     browser. Same colour, same weight, no arrow buttons either way. */
  #panel,#detail,#results{scrollbar-width:thin;
    scrollbar-color:rgba(140,170,235,.26) transparent}
  #panel::-webkit-scrollbar,#detail::-webkit-scrollbar,#results::-webkit-scrollbar{
    width:9px;height:9px;background:transparent}
  #panel::-webkit-scrollbar-track,#detail::-webkit-scrollbar-track,
  #results::-webkit-scrollbar-track{background:transparent}
  #panel::-webkit-scrollbar-thumb,#detail::-webkit-scrollbar-thumb,
  #results::-webkit-scrollbar-thumb{
    background:rgba(140,170,235,.22);border-radius:6px;

  #panel::-webkit-scrollbar-thumb:hover,#detail::-webkit-scrollbar-thumb:hover,
  #results::-webkit-scrollbar-thumb:hover{background:rgba(94,200,240,.42);
    background-clip:padding-box}

  #results::-webkit-scrollbar-button{display:none;width:0;height:0}
  #panel::-webkit-scrollbar-corner,#detail::-webkit-scrollbar-corner{background:transparent}
  .copy,.fixall{appearance:none;border:0;outline:0;cursor:pointer;font-family:inherit;
    font-weight:600;border-radius:5px;
    background:rgba(110,231,168,.16);color:var(--present);transition:background .16s var(--ease),color .16s var(--ease)}
  /* The browser's own ring is a hard light outline and it stayed after a mouse click. Lit
     from the inside instead, like the search box and the filter. */
  .copy:focus-visible,.fixall:focus-visible{box-shadow:inset 0 0 0 1.4px var(--present)}
  .copy{font-size:13px;padding:5px 10px;margin-left:auto;letter-spacing:0;
    text-transform:none}
  .basis{font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;
    padding:4px 9px;border-radius:5px}

  .basis.unverified{background:rgba(242,160,60,.16);color:var(--amber)}
  .basis.precaution{background:rgba(140,170,235,.14);color:var(--ink3)}
  .basis.corrected{background:rgba(255,107,94,.16);color:var(--missing)}
  .basis.done{background:rgba(110,231,168,.15);color:var(--present)}
  .basis.prepared{background:rgba(94,200,240,.16);color:var(--r3)}

  .fixall b{font-family:var(--mono);font-weight:700}
  .close{position:absolute;top:14px;right:14px;appearance:none;border:0;background:transparent;
    color:var(--ink3);cursor:pointer;font-size:16px;line-height:1;padding:4px 6px;border-radius:6px}
  .close:hover{color:var(--ink);background:rgba(140,170,235,.14)}

  /* ---------- graph ---------- */
  .node{cursor:pointer;outline:none}
  .nohit{pointer-events:none}
  /* Node names are 13px on screen at every window width. They are drawn in map units,
     which the viewBox scales, so a fixed 8.5 here meant 10.9px at 1280 and 16.3px at
     1920 — resize() sets --lbl to whatever number of units renders as 13px. */
  .lg .lbl{font-family:var(--font);font-size:var(--lbl,8.5px);font-weight:600;fill:var(--ink);
    pointer-events:none;paint-order:stroke;stroke:var(--void);stroke-width:var(--lblhalo,2.9px);
    stroke-linejoin:round;opacity:0;transition:opacity .26s var(--ease),fill .22s var(--ease)}
  /* Every stroke in the graph is measured in screen pixels, not map units. Without this
     a wide monitor scales the whole viewBox up and thickens every line with it — the same
     1.4 that drew a hairline at 1280 was drawing 3.6px at 2560. Nothing here exceeds 2px.

     .edge is deliberately NOT in this list: it draws itself in with pathLength=1 and a
     one-unit dash, and non-scaling-stroke reinterprets that dash in screen pixels, so the
     line rendered a 1px stub and stopped. Its width is kept under 2px by its map-unit
     value instead — 0.75 at the widest realistic scale is 1.9px. */
  #viz .dot,#viz .flag,#viz .tick,
  #viz g > circle,#viz .lead{vector-effect:non-scaling-stroke}
  /* the ring scaffolding is meaningless while the map is grouped, so it recedes */
  /* The backdrop is the shape the map settles into, so showing it while the map is still
     travelling draws that shape twice — a smudge in the corner with nothing on it yet. It
     stays off until the field is at rest, then fades up under the finished picture. */
  #viz .deco{transition:opacity .62s var(--ease)}
  #viz.orbiting .deco,#viz.settling .deco{opacity:0}
  /* The core's halo and glow are the destination, and showing them while the field is still
     arriving puts a large amber disc in the middle of an opening that is about the nodes
     travelling. They fade up once the map is at rest — which is also when the core becomes
     clickable, so the light arriving and the thing becoming usable are the same moment. */
  #viz .corehalo,#viz .badge.dot,#viz .badge.ring,#viz .badge.flag{
    transition:opacity .55s var(--ease)}
  /* animation:none matters — .flag runs a keyframe animation on opacity, and a running
     animation outranks a plain declaration, so the amber ring stayed lit through an
     opening that had hidden everything else about the core. */
  #viz.orbiting .badge,#viz.settling .badge{opacity:0;animation:none}
  /* Something still has to travel, or the opening loses the centre that drags everything
     else. The plain core — the one the flat views use — stands in: a small amber dot with
     no glow, no rings and no name, which is the same thing the badge is, minus the arrival. */
  #viz.orbiting .plaincore,#viz.settling .plaincore{display:block}
  #viz.orbiting .corelbl,#viz.settling .corelbl{opacity:0}
  /* The rings are the answer, not the question. Nothing names them until the map is
     asked to sort itself out. */
  #viz .scaffold{transition:opacity .72s var(--ease)}
  #viz.orbiting .scaffold,#viz.settling .scaffold{opacity:0}
  /* The line has a job now that the names stand well off their dots: at 0.8px in the
     dimmest ink it was being drawn but not seen, which is the worst of both. */
  .lg .lead{stroke:var(--ink2);stroke-width:1.1;opacity:0;pointer-events:none;
    stroke-linecap:round;transition:opacity .26s var(--ease)}
  .node .dot,.node .ring,.node .flag{transform-box:fill-box;transform-origin:center;
    transition:opacity .34s var(--ease)}
  .node .dot,.node .ring{animation:pop .55s cubic-bezier(.2,.9,.3,1) backwards}
  @keyframes pop{from{opacity:0;transform:scale(.15)}to{opacity:1;transform:scale(1)}}
  /* Faded means "not what you asked for", not "not there". At .08 the rest of the map went
     black and you lost the shape you were reading it against — which is the whole reason
     these views fade rather than hide. */
  .node.faded .dot,.node.faded .ring{opacity:.34}
  .node.faded .flag{animation:none;opacity:.18}
  .lg.faded .lead{opacity:0!important}
  .lg.show .lbl{opacity:1}
  /* A name 500px from its dot is worse than no name: it reads as a label for whatever it
     happens to be next to. Past the displacement cap the label is withdrawn instead. */
  .lg.toofar .lbl{opacity:0}
  /* "Withdrawn" only ever hid the leader line. The name itself stayed on, snapped back
     against its own dot — so a label that could not be placed did not go away, it piled up
     on the node instead, which is exactly the crowding it was meant to prevent. The code
     has always said two names touching is worse than one name missing; now that is what
     happens. */
  .lg.toofar .lbl,.lg.toofar .lead{opacity:0!important}
  .lg.hit .lbl,.lg.sel .lbl{fill:var(--ink)}
  .lg.sel .lbl{font-weight:700}
  .edge{fill:none;pointer-events:none;stroke-dasharray:1;
    transition:stroke-opacity .32s var(--ease),stroke-dashoffset .6s var(--ease)}
  @keyframes pulse{0%,100%{opacity:.2}50%{opacity:.72}}
  .flag{animation:pulse 2.8s ease-in-out infinite}
  .tick{opacity:.85}
  .node.faded .tick{opacity:.26}
  @keyframes breathe{0%,100%{opacity:.05;transform:scale(1)}50%{opacity:.13;transform:scale(1.09)}}
  @keyframes twinkle{0%,100%{opacity:.08}50%{opacity:.4}}
  .corehalo{transform-box:fill-box;transform-origin:center;animation:breathe 5.5s ease-in-out infinite}
  .tw{animation:twinkle ease-in-out infinite}
  /* set back into the scene: nodes pass in front, and it never competes with a name */

    text-anchor:middle;pointer-events:none}
  /* ---------- the bar ----------
     One strip along the bottom edge, left-aligned, tag-sized. The view names are the control;
     the hints under them were explanation, which does not need to be on screen while you are
     looking at a chart. Nothing is in the corners any more, so the map gets the whole frame. */
  #bar{position:fixed;left:16px;bottom:13px;z-index:10;display:flex;align-items:center;
    gap:6px;-webkit-user-select:none;user-select:none}
  #viewmenu{display:flex;gap:5px}
  #bar button{appearance:none;border:0;outline:0;cursor:pointer;font-family:inherit;
    font-size:13px;font-weight:600;letter-spacing:.01em;color:var(--ink3);
    padding:5px 11px;border-radius:7px;background:rgba(8,12,24,.78);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap;
    transition:background .16s var(--ease),color .16s var(--ease)}
  #bar button:hover,#bar button:focus-visible{background:rgba(94,200,240,.16);color:var(--r3)}
  #bar button.on{background:rgba(94,200,240,.20);color:var(--r3)}
  #bar button i{display:none}                  /* the hint text: gone, these are tags now */
  #findbtn{margin-left:6px}
  #findbtn b{font-family:var(--mono);font-weight:700;margin-left:6px;opacity:.75}
  #stamp{font-family:var(--mono);font-size:10.5px;line-height:1.35;color:var(--ink3);
    margin-left:8px;white-space:nowrap;opacity:.75}
  #stamp b{color:var(--ink2);font-weight:700}
  #stamp .warn{color:var(--amber);opacity:1}
  #stamp br{display:none}                      /* one line down here, not two */
  @media(max-width:820px){#bar{display:none}}

  /* the board's column headings are two facts, so they get two lines and a tally */
  /* Chart text is sized in screen pixels like the node names, not in map units — a unit is
     a different number of pixels at every window width, which is how the headings ended up
     bigger than anything else on the page. Nothing here, or anywhere in the app, goes over
     16px; these sit well under it because there are seventeen of them side by side. */
  .hubn{font-family:var(--mono);font-size:var(--hubn,15px);font-weight:700;letter-spacing:.02em}
  .hublbl{font-family:var(--font);font-size:var(--hubl,10px);font-weight:700;letter-spacing:.03em}
  .lanelbl{font-family:var(--font);font-size:var(--lane,12.5px);font-weight:700;
    letter-spacing:.02em;paint-order:stroke;stroke:var(--void);stroke-width:2.4px;
    stroke-linejoin:round}
  .hdhit{cursor:pointer}
  .hdhit:focus-visible{outline:none;stroke:var(--r3);stroke-opacity:.55;stroke-width:1px}
  #flow{pointer-events:none}
  .collbl{font-family:var(--font);font-size:var(--col,11px);font-weight:600;
    letter-spacing:.01em;text-anchor:middle;pointer-events:none}
  /* A column heading names the pile and explains nothing, and the numbered ones name a step
     of a plan the reader may not have open. Pressing one says what the column is for. */
  .hdhit{cursor:pointer;outline:none}
  .collbl.hd{pointer-events:none;
    transition:fill .16s var(--ease),text-decoration-color .16s var(--ease);

    text-decoration-color:rgba(232,237,248,.22)}

  .ringsub{font-family:var(--font);font-size:var(--colsub,10px);font-weight:400;
    letter-spacing:.01em;text-anchor:middle;pointer-events:none}
  .ringcount{font-family:var(--mono);font-size:var(--colsub,10px);font-weight:600;
    text-anchor:middle;pointer-events:none}
  /* the core in a flat view: a node like the others, named beside itself rather than inside */
  #viz.flatcore .badge{display:none}
  #viz:not(.flatcore):not(.orbiting):not(.settling) .plaincore{display:none}
  .corelbl{font-family:var(--font);font-size:var(--lbl,11px);font-weight:600;
    paint-order:stroke;stroke:var(--void);stroke-width:var(--lblhalo,2.9px);
    stroke-linejoin:round;pointer-events:none}
  /* above the layout bar, not under it */
  #hint{position:fixed;left:50%;bottom:66px;transform:translateX(-50%);font-family:var(--mono);
    font-size:10.5px;color:var(--ink3);pointer-events:none;transition:opacity .4s;
    white-space:nowrap;z-index:10}
  @media(max-width:820px){#hint{display:none}}
  #hint.gone{opacity:0}
  /* at this scale the view has to be steerable, so it needs a visible readout */
  /* ---------- left column: where you have been ----------

     is the information: the route you took through the map is the thing worth being able
     to walk back up. */
  #pathpanel{flex:0 1 auto;min-height:0;padding:13px 15px;display:flex;flex-direction:column;
    -webkit-user-select:none;user-select:none}
  #pathpanel[hidden]{display:none}
  .pptitle{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.14em;color:var(--ink3);font-weight:700;margin-bottom:11px;flex:none}
  .ppcount{font-family:var(--mono);font-size:13px;font-weight:400;color:var(--ink3);
    margin-left:auto;letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
  .ppclear{appearance:none;border:0;background:transparent;color:var(--ink3);cursor:pointer;
    font-family:inherit;font-size:13px;padding:2px 6px;border-radius:5px;letter-spacing:0;
    text-transform:none;font-weight:500;transition:background .16s var(--ease),color .16s var(--ease)}
  .ppclear:hover,.ppclear:focus-visible{background:rgba(140,170,235,.20);color:var(--ink);

<svg id="viz" role="img" aria-label="Radial map of every skill available to me"></svg>
<div id="tip" class="card" role="tooltip"></div>
<!-- One bar, bottom left. It used to be three pieces of furniture — a layout column
     top-left, a zoom control bottom-left, a findings button between them — each standing on a
     different part of the map. The map is the subject; the controls are a strip along one
     edge, sized like tags. -->
<div id="bar">
  <div id="viewmenu"></div>
  <button id="findbtn" type="button"></button>
  <div id="stamp"></div>
</div>
</div>
<div id="hint">scroll to zoom · drag to pan · click a node for its links · esc to clear · / to search</div>

<div id="panel">
  <div class="sbox card">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" type="search" placeholder="Search skills…" autocomplete="off"
           role="combobox" aria-expanded="false" aria-controls="results">
    <span class="kbd">/</span>
    <button id="qclear" type="button" aria-label="Clear the filter">Clear ✕</button>
    <div id="results" class="card" role="listbox"></div>
  </div>
  <!-- Two controls that look identical and do opposite things: one removes nodes, the other
       repaints them. Neither said so, and a dropdown you have to try in order to find out
       what it does is a dropdown people leave alone. -->
  <div class="selrow">
    <select id="capsel" class="card" aria-label="Filter by capability"></select>
    <button class="q selq" data-tip="<b>Shows only the skills that do a particular kind of work</b> — accessibility, data, security, testing and so on. Everything else disappears until you set it back to <i>All capabilities</i>.<br><br>The tags come from this map's own index, not from the skills: what actually decides whether a skill fires is its description. Treat this as a way of browsing, not as a statement about what Claude will load.">?</button>
  </div>
  <!-- The colour-by control is gone at Joe's request. It only ever repainted the nodes, and
       its default — colour by ring — is the one the key below describes, so the map reads the
       same without it and the panel is one control shorter. colourMode stays in the code at
       its default; restoring the select is the only thing needed to bring the other mode
       back. -->

  <div id="key" class="card">
    <div class="krow2">
      <span class="chip tog" data-f="present"><i style="background:var(--present)"></i>available<b id="k-p"></b></span>
      <span class="chip tog" data-f="missing"><i class="hollow"></i>missing<b id="k-m"></b></span>
      <span class="chip tog" data-f="never"><i class="solidh"></i>excluded<b id="k-n"></b></span>
      <button class="q" data-tip="<b>Available</b> — the file exists and Copilot can load it. <b>Missing</b> — referenced by another file, or by an <code>applyTo</code> glob, with nothing of that name in the repository. <b>Retired</b> — still present but marked do-not-use; it keeps loading until someone deletes it, which is the point of showing it.<br><br>Click any of the three to filter.">?</button>
    </div>
    <div class="krow2">
      <span class="chip"><i class="ln" style="background:var(--bind)"></i>always-on</span>
      <span class="chip"><i class="ln" style="background:var(--phase)"></i>conditional</span>

      <button class="q" data-tip="<b>Always-on</b> — the file loads on every request in its scope, before the prompt is read. Organisation and repository surfaces are always-on.<br><br><b>Conditional</b> — it loads only when something matches: an <code>applyTo</code> glob, or a deliberate invocation.<br><br><b>Overlap</b> — two files claiming the same ground. Both load, their advice is merged with no precedence, and which one wins is not predictable. <b>At this scale it is the only failure mode that matters.</b>">?</button>
    </div>
  </div>

  <div id="key2" class="card">
    <div class="ringkey">
      <span class="byring tog" data-r="org"><i style="background:var(--r1)"></i>organisation</span>
      <span class="byring tog" data-r="repo"><i style="background:var(--r2)"></i>repository</span>
      <span class="byring tog" data-r="scoped"><i style="background:var(--r3)"></i>path-scoped</span>
      <span class="byring tog" data-r="ondemand"><i style="background:var(--r4)"></i>on demand</span>
      <span class="byring tog" data-r="ext"><i style="background:var(--r5)"></i>extensions</span>
      <span class="bycap"><i style="background:#5EC8F0"></i>UI</span>
      <span class="bycap"><i style="background:#A78BFA"></i>data</span>
      <span class="bycap"><i style="background:#6EE7A8"></i>quality</span>
      <span class="bycap"><i style="background:#FF6B5E"></i>security</span>
      <span class="bycap"><i style="background:#F2A03C"></i>ops</span>
      <span class="bycap"><i style="background:#E879C7"></i>content</span>
      <span class="always tog" data-k="agent"><i class="dot-agent"></i>custom agent</span>
      <span class="always tog" data-k="settled"><i class="dot-done"></i>settled</span>
    </div>
    <button id="pickclear" type="button">Show everything again</button>
  </div>

  <div id="key3" class="card">
    <div class="krow tog" id="k-flag"><i style="background:var(--amber);box-shadow:0 0 0 3px rgba(242,160,60,.3)"></i>open items<b id="k-f"></b><button class="q" data-tip="">?</button></div>
    <button id="fixall" class="fixall">Copy all <b id="k-f2"></b> fixes, in order</button>
    <div class="demoflag" id="demoflag"></div>
  </div>

  <div id="pathpanel" class="card" hidden>
    <div class="pptitle">Your path <span class="ppcount" id="pp-n">0</span>
      <button class="ppclear" id="pp-clear" type="button">Clear</button></div>
    <div class="pplist" id="pp-list"></div>
  </div>

  <div id="findings" class="card" hidden></div>
</div>

<script>
/* ------------------------------------------------------------------ data
   Replaced at build time by docs/skills-map/skills-data.js — see scripts/build-map.mjs. */
/* ------------------------------------------------------------------ setup */
const cv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL={present:'--present',missing:'--missing',never:'--never',anchor:'--amber'};
// Every skill resolves now, so status is one colour and tells you nothing. Colour carries the
// ring instead — which library a skill is in and what asks for it.
const RINGCOL={org:'--r1',repo:'--r2',scoped:'--r3',ondemand:'--r4',ext:'--r5'};
// Colouring by all 16 tags is unreadable. These six families are, and every tag lands in one.
const FAMILY={frontend:'ui',design:'ui',accessibility:'ui',performance:'ui',
 data:'data',api:'data',documents:'data',
 testing:'quality',review:'quality',
 security:'security',
 infrastructure:'ops',config:'ops',
 content:'content',seo:'content',planning:'content',audio:'content'};
const FAMCOL={ui:'#5EC8F0',data:'#A78BFA',quality:'#6EE7A8',security:'#FF6B5E',
 ops:'#F2A03C',content:'#E879C7',none:'#5E6B8C'};
const famOf=n=>FAMILY[(n.tags||[])[0]]||'none';
let colourMode='ring';
const colourOf=n=>statusOf(n)==='never'?'--never'
  :statusOf(n)==='missing'?'--missing':(RINGCOL[n.ring]||'--present');
const paintOf=n=>colourMode==='cap'&&n.ring?FAMCOL[famOf(n)]:cv(colourOf(n));
const statusOf=s=>s.phase==='never'?'never':s.status;
const NS='http://www.w3.org/2000/svg';
const mk=(t,a={})=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
const $=i=>document.getElementById(i), svg=$('viz');
const P=(cx,cy,r,a)=>[cx+Math.cos(a)*r, cy+Math.sin(a)*r];
const arc=(cx,cy,r,a0,a1)=>{const s=P(cx,cy,r,a0),e=P(cx,cy,r,a1);
  return `M${s[0].toFixed(1)},${s[1].toFixed(1)}A${r.toFixed(1)},${r.toFixed(1)} 0 ${(a1-a0)>Math.PI?1:0} 1 ${e[0].toFixed(1)},${e[1].toFixed(1)}`;};
const SLOW=matchMedia('(prefers-reduced-motion: reduce)').matches;

let W=1000,H=740,CX=500,CY=370,MAXR=340,SAFE_L=10,SAFE_R=990,SAFE_B=0;
// What the key does now lives in PICKS, further down with the handlers that drive it.
let query='', sel=null, hover=null, cur=-1, res=[], hits=null;

let seed=20260806; const rnd=()=>((seed=(seed*1103515245+12345)&0x7fffffff)/0x7fffffff);
const home={}, sectors=[];
RINGS.forEach(R=>{
  const list=SKILLS.filter(s=>ringOf(s)===R.key);
  if(R.key==='scoped'||R.key==='ondemand'){
    const groups={}; list.forEach(s=>(groups[s.phase]??=[]).push(s));
    const keys=[...DOMAINS,'never'].filter(k=>groups[k]);
    const GAP=0.028, span=(Math.PI*2-GAP*keys.length)/list.length;
    let a=-Math.PI/2+GAP/2;
    keys.forEach(k=>{ const arr=groups[k], a0=a;
      arr.forEach((s,i)=>{ home[s.id]=a+span*(i+.5); });
      a+=span*arr.length; sectors.push({key:k,a0,a1:a,col:SECTOR[k],n:arr.length}); a+=GAP; });
  } else list.forEach((s,i)=>{ home[s.id]=-Math.PI/2+((i+.5)/list.length)*Math.PI*2; });
});
const RF={}, RBAND={}; RINGS.forEach(R=>{RF[R.key]=R.frac; RBAND[R.key]=R.band;});
const bandCount={};
const N=SKILLS.map(s=>{
  const k=ringOf(s), b=RBAND[k], i=(bandCount[k]=(bandCount[k]||0)+1)-1;
  const t=(i*0.6180339887498949)%1;          // low-discrepancy: no rings, no clumps
  return {...s, ring:k, x:0,y:0,vx:0,vy:0,
    A:home[s.id], F:b[0]+(b[1]-b[0])*t, R:0, rad:5, agent:s.src==='agent'};});
const isOpen=id=>!!FIXES[id] && (BASIS[id]||[])[0]!=='done';
N.forEach(n=>{ n.flag = isOpen(n.id); n.tags = TAGS[n.id]||[]; });
ANCHOR.flag = isOpen(ANCHOR.id);
console.assert(N.every(n=>n.tags.length),'untagged skill',N.filter(n=>!n.tags.length).map(n=>n.id));
const IDX={}; N.forEach((n,i)=>IDX[n.id]=i);

const EDGES=[], pairSeen=new Set();
N.forEach(n=>{ EDGES.push({a:ANCHOR.id,b:n.id,kind:n.phase==='always'?'bind':'phase'});
  // canonical pair key, not `r > n.id` — that silently dropped any relation declared on
  // only one side whose partner sorted lower (security-review -> security, for one)
  n.rel.forEach(r=>{ if(IDX[r]===undefined) return;
    const key=n.id<r?n.id+'|'+r:r+'|'+n.id;
    if(pairSeen.has(key)) return; pairSeen.add(key);
    EDGES.push({a:n.id,b:r,kind:'overlap'}); }); });
const neigh={}; N.forEach(n=>neigh[n.id]=new Set());
EDGES.filter(e=>e.kind==='overlap').forEach(e=>{neigh[e.a].add(e.b);neigh[e.b].add(e.a);});

$('k-p').textContent=N.filter(n=>statusOf(n)==='present').length;
$('k-m').textContent=N.filter(n=>statusOf(n)==='missing').length;
$('k-n').textContent=N.filter(n=>statusOf(n)==='never').length;
// the anchor carries a fix but is not in N, so count the same set the brief does — otherwise
// the row says 14 and the button says 15, and both are right about different things
const FIXCOUNT=[ANCHOR].concat(N).filter(n=>isOpen(n.id)).length;
$('k-f').textContent=FIXCOUNT;
{ // spell the number out where it is shown, not only in the copied brief
  const open=[ANCHOR].concat(N).filter(n=>isOpen(n.id));
  const tally=k=>open.filter(n=>NEEDS[n.id]===k).length;
  $('k-flag').querySelector('.q').dataset.tip=
    '<b>'+FIXCOUNT+' still open.</b> Settled ones keep a green dashed ring on the map, carry no '+
    'fix, and are not in the copied brief.<br><br>Not all of these need a change:<br><br>'+
    '<b>'+tally('paste')+'</b> need a paste — the replacement text is written out already.<br>'+
    '<b>'+tally('command')+'</b> need one command, and will probably close.<br>'+
    '<b>'+tally('read')+'</b> need a skill read, then a call.<br>'+
    '<b>'+tally('decide')+'</b> need a decision only you can make.<br><br>'+
    'Where I got something wrong, correcting my claim did not remove the item — it changed '+
    'what the item asks you to do. Click the row to show only these.';
}

/* ------------------------------------------------------------------ svg scaffold */

/* A real honeycomb, matched to the reference: pointy-top cells packed edge to edge, each
   one a moulded plate rather than an outline. What makes the reference read as hexagons is
   not a stroke around each cell — it is that every plate is lit from above. A bright bevel
   along its upper three edges, a dark one along its lower three, and a near-black gap
   between. Outlining them instead, which is what this did before, gives a wire lattice.

   Pointy-top hex of circumradius R: rows sit 1.5R apart, columns sqrt(3)R apart, and every
   other row shifts half a column. So a tile sqrt(3)R wide by 3R tall carries one whole cell
   at its centre and four quarter-cells at its corners, which complete themselves against
   the next tile. Built in code because it only tessellates if the geometry is exact.

   Kept dark on purpose — the reference is a mid grey and this sits behind a map. */
const HEXPATTERN=(()=>{
  const R=21, w=Math.sqrt(3)*R, H2=3*R;        // tile 36.37 x 63
  const K=0.955;                               // plate inset: what leaves the gap
  // vertices clockwise from the top point
  const pts=(cx,cy)=>{ const r=R*K, x=w/2*K;
    return [[cx,cy-r],[cx+x,cy-r/2],[cx+x,cy+r/2],[cx,cy+r],[cx-x,cy+r/2],[cx-x,cy-r/2]]; };
  const poly=p=>'M'+p.map(([x,y])=>`${x.toFixed(2)},${y.toFixed(2)}`).join('L')+'Z';
  const run=(p,i,n)=>'M'+Array.from({length:n+1},(_,k)=>p[(i+k)%6])
    .map(([x,y])=>`${x.toFixed(2)},${y.toFixed(2)}`).join('L');
  const centres=[[w/2,H2/2],[0,0],[w,0],[0,H2],[w,H2]];
  const plates=centres.map(c=>poly(pts(...c))).join(' ');
  // upper three edges catch the light, lower three fall away
  const lit  =centres.map(c=>run(pts(...c),4,3)).join(' ');   // upper-left → top → upper-right
  const shade=centres.map(c=>run(pts(...c),1,3)).join(' ');   // lower-right → bottom → lower-left
  return `
 <linearGradient id="plate" x1="0" y1="0" x2=".25" y2="1">
   <stop offset="0%" stop-color="#151B29"/><stop offset="100%" stop-color="#080B13"/>
 </linearGradient>
 <pattern id="hex" width="${w.toFixed(3)}" height="${H2}" patternUnits="userSpaceOnUse"
          patternTransform="scale(0.66)">
   <rect width="${w.toFixed(3)}" height="${H2}" fill="#04060B"/>
   <path d="${plates}" fill="url(#plate)"/>
   <path d="${shade}" fill="none" stroke="#02040A" stroke-opacity=".95" stroke-width="1.6"
         stroke-linejoin="round"/>
   <path d="${lit}" fill="none" stroke="#39435C" stroke-opacity=".62" stroke-width="1.3"
         stroke-linejoin="round"/>
 </pattern>`;
})();

const defs=mk('defs');
defs.innerHTML=`
 <radialGradient id="core" cx="50%" cy="50%" r="50%">
   <stop offset="0%" stop-color="#FFD79B"/><stop offset="55%" stop-color="#F2A03C"/>
   <stop offset="100%" stop-color="#C86B18"/></radialGradient>
 <filter id="glow" x="-140%" y="-140%" width="380%" height="380%">
   <feGaussianBlur stdDeviation="5" result="b"/>
   <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="glowsm" x="-120%" y="-120%" width="340%" height="340%">
   <feGaussianBlur stdDeviation="2.4" result="b"/>
   <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
   <feGaussianBlur stdDeviation="1.2"/></filter>`;
const gSpin=mk('g'), gDeco=mk('g',{class:'deco',filter:'url(#soft)'}), gRing=mk('g'), gFlow=mk('g',{id:'flow'}), gEdge=mk('g'), gNode=mk('g'), gRingTop=mk('g'), gLabel=mk('g');
gSpin.append(gDeco);

/* The world scales and pans; the labels do not. gLabel is deliberately OUTSIDE gWorld and
   positioned in screen units, so a name stays 13px and a stroke stays a hairline however
   far you zoom in — and so the dodge engine, which reasons about the visible rectangle,
   keeps working on coordinates that mean what it thinks they mean. */
const gWorld=mk('g',{id:'world'});
/* The board is wider than the frame and pans, so its far columns run under the right-hand
   panel — which is translucent, so they showed through it as a smear rather than stopping.
   In the flat views the world is clipped to the strip the panel leaves; a column you have
   not panned to yet is simply not drawn. */
const clipR=mk('rect',{x:0,y:0,width:1000,height:1000});
{ const cp=mk('clipPath',{id:'safeclip'}); cp.appendChild(clipR); defs.appendChild(cp); }
function clipFlat(){
  if(!FLAT()){ gClip.removeAttribute('clip-path'); return; }
  // The clip lives inside the pan transform, so its rectangle is in world units, not screen
  // ones. Setting it to the screen strip once meant the window itself slid away with the
  // pan and the board disappeared into it. Convert the strip back through the transform
  // every time either of them moves.
  clipR.setAttribute('x',((SAFE_L-6-panX)/zoom).toFixed(1));
  clipR.setAttribute('y',((-40-panY)/zoom).toFixed(1));
  clipR.setAttribute('width',((SAFE_R-SAFE_L+12)/zoom).toFixed(1));
  clipR.setAttribute('height',((H+80)/zoom).toFixed(1));
  gWorld.setAttribute('clip-path','url(#safeclip)');
}
gRing.setAttribute('class','scaffold'); gRingTop.setAttribute('class','scaffold');
/* The clip is what keeps a board that is wider than the frame from sliding under the
   right-hand panel, and it was put on the whole world — which took the decorative ground
   with it. The honeycomb then stopped dead at the panel's edge, leaving the map sitting on
   a bare rectangle. Only the map itself needs clipping; the ground runs edge to edge as it
   always did. */
/* Names take precedence over links, by knocking themselves out of the link layer.
   Routing links around the names was the first attempt and it was worse than the problem:
   a line coming up from below-left at a twenty-character name has to travel the whole width
   of it, so the detour ends up longer and louder than the line it was avoiding.
   Interrupting the line where the name is says the same thing — the name wins — in no ink
   at all, and it is what a map does when a road meets a place name. */
const lblMask=mk('mask',{id:'lblmask',maskUnits:'userSpaceOnUse'});
const maskAll=mk('rect',{x:-4000,y:-4000,width:12000,height:12000,fill:'#fff'});
lblMask.appendChild(maskAll);
defs.appendChild(lblMask);
gEdge.setAttribute('mask','url(#lblmask)');

const gClip=mk('g',{id:'clipped'});
gClip.append(gRing,gFlow,gEdge,gRingTop,gNode);
gWorld.append(gSpin,gClip);
let zoom=1, panX=0, panY=0;
// The anchor is a landmark, not a subject. Left to scale with the view it becomes an
// orange wall at 5x, so it grows to about 1.6x and then stops.
const coreScale=()=>FLAT()?1:Math.min(1,1.6/zoom);
const toScreenX=x=>x*zoom+panX, toScreenY=y=>y*zoom+panY;
const toWorldX=x=>(x-panX)/zoom, toWorldY=y=>(y-panY)/zoom;
/* Node names live outside gWorld so they hold 13px at any zoom. The column headings and the
   arc's phase ticks do not — they are drawn in world units, so at 2.2x they came out twice
   the size of the names they sit above and dominated the picture. They are labels, not
   content; they should read the same at every zoom, like the names do.

   Counter-scaling only above 1x. Below it the board is zoomed out to fit its full width, and
   growing the headings back would push them out of the columns fitText just measured them
   into. Zoomed out, a heading shrinking with its column is what you expect anyway. */
let scafZ=0;
function sizeScaffold(){
  const f=1/Math.max(1,zoom);
  if(Math.abs(f-scafZ)<0.002) return;
  scafZ=f;
  for(const t of gRingTop.querySelectorAll('.collbl,.ringsub,.ringcount,.lanelbl,.hubn,.hublbl')){
    if(t._base===undefined) t._base=parseFloat(getComputedStyle(t).fontSize);
    t.style.fontSize=(t._base*f).toFixed(2)+'px';
  }
}
function applyView(){ gWorld.setAttribute('transform',
  `translate(${panX.toFixed(2)},${panY.toFixed(2)}) scale(${zoom.toFixed(4)})`);
  clipFlat(); sizeScaffold(); }

// The ground is its own layer beneath the trail canvas, because the map above it has to
// be transparent for the trails to show through at all.
const bgsvg=mk('svg',{id:'bgviz','aria-hidden':'true'});
const bgdefs=mk('defs');
bgdefs.innerHTML=HEXPATTERN+`
 <radialGradient id="vig" cx="50%" cy="48%" r="72%">
   <stop offset="0%" stop-color="#0B1120" stop-opacity="0"/>
   <stop offset="50%" stop-color="#070A14" stop-opacity=".38"/>
   <stop offset="100%" stop-color="#04060C" stop-opacity=".94"/></radialGradient>`;
bgsvg.append(bgdefs, mk('rect',{x:0,y:0,width:'100%',height:'100%',fill:'url(#hex)'}),
  mk('rect',{x:0,y:0,width:'100%',height:'100%',fill:'url(#vig)'}));
document.body.insertBefore(bgsvg, document.body.firstChild);
svg.append(defs, gWorld, gLabel);

/* ---- the decorative field ------------------------------------------------------------
   The soft coloured bands behind the map were drawn as five concentric arcs, which is the
   radial layout's own shape and belongs to it. In the board and the arc it stayed a circle
   while the chart underneath was a row of columns or a fan over a line, so the backdrop was
   describing a picture that was no longer on the screen.

   It is now the same field of dots in every layout, moved rather than redrawn: the same
   circle in radial, vertical bands standing in the columns' own footprints on the board,
   and nested domes echoing the link arcs in the arc. Switching view tweens each dot from
   where it is to where it belongs, over about a second, and then stops — a move, not a
   loop. Nothing about it repeats or draws attention to itself once it has arrived.

   Fixed population, stable per-dot parameters: a morph needs the same dot to exist on both
   sides of the transition, so the count cannot depend on the layout. */
const DECO=[];
// The original drew as many dots per band as the arc length needed, which came to roughly
// 120 for the innermost. A fixed count has to match that or the bands read as a dotted line
// rather than a glow — and the arc's domes are longer than the circle's bands, so slightly
// more again.
{ const BANDS=5, PER=140, STARS=150;
  for(let b=0;b<BANDS;b++) for(let i=0;i<PER;i++)
    DECO.push({kind:'band', b, u:(i+.5)/PER, v:rnd(), j:rnd()*2-1,
               r:1.05-b*.06, op:.42-b*.055});
  for(let i=0;i<STARS;i++)
    DECO.push({kind:'star', u:rnd(), v:rnd(), j:rnd()*2-1, a:rnd()*Math.PI*2,
               r:.5+rnd()*.7, op:.10+rnd()*.22, tw:i%3===0,
               dur:(3+rnd()*5).toFixed(1)+'s', del:(rnd()*6).toFixed(1)+'s'});
  for(const d of DECO){
    d.el=mk('circle',{r:d.r.toFixed(2),'fill-opacity':d.op.toFixed(2)});
    if(d.tw){ d.el.setAttribute('class','tw');
      d.el.style.animationDuration=d.dur; d.el.style.animationDelay=d.del; }
    gDeco.appendChild(d.el);
  }
}

/* Where every dot belongs in the layout that is showing now. The board and the arc read
   their geometry off SCAF, which homes() has just rebuilt, so the backdrop follows the
   chart automatically rather than carrying a second copy of its measurements. */
function decoTargets(){
  const cols = SCAF.filter(s=>s.t==='col');
  const hubs = SCAF.filter(s=>s.t==='hub');
  const board = VIEW==='board' && cols.length;
  const flow  = VIEW==='flow'  && hubs.length;
  for(const d of DECO){
    if(flow){
      // four soft streams lying along the four destinations, widest where the ribbons leave
      // the field and narrowing into the hub — the same shape the ribbons draw
      const h=hubs[Math.min(hubs.length-1,Math.floor(d.u*hubs.length))];
      const t=(d.u*hubs.length)%1;
      const x0=FLATX[0]+30, k=d.kind==='band'?t:d.v;
      d.tx=x0+(h.x-x0)*k;
      // spread wide at the source and converge on the hub, and give each band its own offset
      const spread=(1-k)*(d.kind==='band'?18+d.b*9:34)*(d.j||1);
      d.ty=h.y+spread*(d.kind==='band'?1:(d.v*2-1));
      d.tc=d.kind==='band'?h.col:'#8FB0E8';
    } else if(board){
      // one band per column, standing in that column's own footprint — so the backdrop
      // rises and falls with how much each column actually holds
      const c = cols[Math.min(cols.length-1, Math.floor(d.u*cols.length))];
      const t = (d.u*cols.length)%1;
      d.tx = c.x + c.w*(.14+.72*(d.kind==='band'?t:d.v));
      d.ty = d.kind==='band'
        ? c.top - 16 + (c.base+22-(c.top-16))*(d.v*.86+d.b*.028)
        : c.headTop-56 + (H-c.headTop+40)*d.v;
      d.tc = d.kind==='band' ? c.col : '#8FB0E8';
    } else {
      // the original circle: five arcs banded by sector, and a scatter of stars beyond them
      if(d.kind==='band'){
        const S = sectors.length ? sectors[Math.min(sectors.length-1,
                    Math.floor(d.u*sectors.length))] : null;
        if(!S){ d.tx=CX; d.ty=CY; d.tc='#8FB0E8'; continue; }
        const t=(d.u*sectors.length)%1, r=MAXR*(.375+d.b*.036);
        [d.tx,d.ty]=P(CX,CY,r,S.a0+(S.a1-S.a0)*t); d.tc=S.col;
      } else {
        [d.tx,d.ty]=P(CX,CY,MAXR*(1.02+d.v*.22),d.a); d.tc='#8FB0E8';
      }
    }
  }
}

/* A dot outside the frame is not worth drawing, and in the flat views most of the star
   scatter would be. Hiding rather than removing keeps the population stable. */
function decoPaint(){
  for(const d of DECO){
    d.el.setAttribute('cx',d.x.toFixed(1)); d.el.setAttribute('cy',d.y.toFixed(1));
    d.el.setAttribute('fill',d.c||d.tc);
    d.el.style.display = (d.x<-40||d.x>W+40||d.y<-40||d.y>H+40) ? 'none' : '';
  }
}

let decoRAF=0;
function deco(anim){
  decoTargets();
  if(decoRAF){ cancelAnimationFrame(decoRAF); decoRAF=0; }
  const first = DECO[0].x===undefined;
  if(!anim || first || matchMedia('(prefers-reduced-motion: reduce)').matches){
    for(const d of DECO){ d.x=d.tx; d.y=d.ty; d.c=d.tc; }
    decoPaint(); return;
  }
  // Straight from here to there on a soft ease. It runs once and ends; there is no idle
  // animation left behind to compete with the map for attention.
  const from = DECO.map(d=>({x:d.x,y:d.y,c:d.c}));
  const t0 = performance.now(), DUR = 900;
  const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
  const step = now => {
    const p = Math.min(1,(now-t0)/DUR), e = ease(p);
    DECO.forEach((d,i)=>{ d.x=from[i].x+(d.tx-from[i].x)*e;
                          d.y=from[i].y+(d.ty-from[i].y)*e;
                          d.c=e>.5?d.tc:from[i].c; });
    decoPaint();
    if(p<1) decoRAF=requestAnimationFrame(step); else decoRAF=0;
  };
  decoRAF=requestAnimationFrame(step);
}
/* ---- the opening ---------------------------------------------------------------------
   The map arrives in motion: every node on its own ring, in no particular order, each ring
   turning at its own rate. It says "these are the five places configuration comes from and
   there is a lot of it" without asking anyone to read a word. The first click stops the
   drift and sorts each ring by engineering domain — the same rings, ordered.

   Inner rings turn faster and neighbouring rings turn opposite ways, which is what stops
   the whole thing reading as one rigid disc rotating. */
let orbiting=true, spinT=0;
// during the drift the centre is the page's, not the layout's
const oCX=()=>orbiting?W/2:(settled?AX:coreX);
const oCY=()=>orbiting?H/2:(settled?AY:coreY);
function orbitHomes(){
  N.forEach(n=>{
    if(n.oA===undefined){
      n.oA   = rnd()*Math.PI*2;                        // anywhere on the clock
      // radius by sqrt so the disc fills evenly rather than crowding the middle, and
      // deliberately unrelated to the ring this node will end up in
      n.oF   = .10+Math.sqrt(rnd())*.92;
      // its own rate, its own direction. Tighter orbits run faster, the way they would,
      // but with enough spread that no two nodes keep step for long
      n.oSpd = (rnd()<.5?-1:1)*(.10+rnd()*.80)*Math.min(2.4,Math.pow(.75/n.oF,.65));
    }
    n.oR = n.oF*Math.min(W/2-20, H/2-20);
  });
  RINGS.forEach(R=>{ R.top=CY-(R.band?R.band[1]:R.frac)*MAXR-10; });
}
function orbitPlace(){
  const cx=oCX(), cy=oCY();
  N.forEach(n=>{ const a=n.oA+spinT*n.oSpd;
    n.x=cx+Math.cos(a)*n.oR; n.y=cy+Math.sin(a)*n.oR;
  });
}
/* ---- the settle -----------------------------------------------------------------------
   The centre moves first and everything else is dragged after it.

   Three things happen at once and none of them is a tween between two positions. The core
   glides from the middle of the page to the middle of the layout. While it travels it drags
   the field: each node takes a share of the core's own velocity, weighted by how close it
   is, so the inner ones are yanked along and the outer ones barely feel it. Then a spring
   to each node's place on its ring switches on — inner rings first, propagating outward —
   and gravity does the rest. Nodes arrive, overshoot a little, and settle.

   Nothing is clickable, nothing is named and no ring is drawn until the whole field has
   come to rest. A click during the settle is remembered, not ignored, and applied the
   moment it goes live. */
let settled=true;                       // false only while the field is coming to rest
let pending=null;                       // a click made mid-settle, applied when it lands
let coreX=0, coreY=0, corePX=0, corePY=0;
const CORE_MS=760, SPRING=0.055, DRAG=0.865, SETTLE_MS=520;
let restFrames=0;

function startSettle(aimed){
  if(!orbiting) return;
  orbiting=false; settled=false; restFrames=0;
  pending=aimed||null;
  svg.classList.remove('orbiting'); svg.classList.add('settling');
  sparks.length=0; tcv.style.opacity='0';
  setTimeout(()=>tcx.clearRect(0,0,TW,TH),700);
  rings();
  coreX=corePX=W/2; coreY=corePY=H/2;
  settleT=0; settleAcc=0; settleWall=performance.now();
  N.forEach(n=>{ n.vx=n.vy=0;
    // the pull reaches the inner rings first and travels outward
    n._gate = (n.F-0.15)/0.9*SETTLE_MS*0.75; });
  alpha=0;
  if(!raf) raf=requestAnimationFrame(tick);
}

/* Substepped at a fixed 60Hz rather than once a frame. A spring advanced once per frame
   settles in a second at 60fps and never settles at all on something slower — traced at
   ten frames a second it was still 51 units out after four. The clock is virtual, so the
   choreography is identical on any machine, and a hard stop guarantees it always lands. */
let settleT=0, settleAcc=0, settleWall=0;
const STEP=1000/60, SETTLE_CAP=3600;

function settleSub(){
  settleT+=STEP;
  const k=Math.min(1,settleT/CORE_MS), e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
  corePX=coreX; corePY=coreY;
  coreX=W/2+(CX-W/2)*e; coreY=H/2+(CY-H/2)*e;
  const cvx=coreX-corePX, cvy=coreY-corePY;
  const reach=Math.max(1,MAXR);
  let moving=0;
  for(const n of N){
    // dragged along by the centre, hardest on whatever is closest to it
    const d=Math.hypot(n.x-coreX,n.y-coreY);
    const share=Math.max(0,1-d/(reach*1.35));
    n.vx+=cvx*share*1.9; n.vy+=cvy*share*1.9;
    // then gravity toward its place, switched on ring by ring
    const g=Math.max(0,Math.min(1,(settleT-n._gate)/300));
    n.vx+=(n.hx-n.x)*SPRING*g; n.vy+=(n.hy-n.y)*SPRING*g;
    n.vx*=DRAG; n.vy*=DRAG;
    n.x+=n.vx; n.y+=n.vy;
    if(Math.abs(n.vx)+Math.abs(n.vy)>0.09 || Math.hypot(n.hx-n.x,n.hy-n.y)>1.4) moving++;
  }
  restFrames = (moving===0 && settleT>CORE_MS) ? restFrames+1 : 0;
  return restFrames>=4 || settleT>SETTLE_CAP;
}

function settleStep(){
  const now=performance.now();
  settleAcc+=Math.min(200, now-settleWall); settleWall=now;
  let done=false, guard=0;
  while(settleAcc>=STEP && guard++<24){ settleAcc-=STEP; if(settleSub()){ done=true; break; } }
  if(!done) return;
  N.forEach(n=>{ n.x=n.hx; n.y=n.hy; n.vx=n.vy=0; });
  coreX=CX; coreY=CY;
  settled=true; svg.classList.remove('settling');
  if(pending){ const p=pending; pending=null; select(p); }
  else apply();
}

function unpack(aimed){ startSettle(aimed); }

let ringBoxes=[];
function rings(){
  gRing.textContent=''; gRingTop.textContent=''; ringBoxes=[];

/* Whatever a view puts behind its nodes. Registered in ringBoxes for the same reason the
   ring titles are: a node name that lands on a column heading is unreadable. */
function scaffold(){
  SCAF.forEach(s=>{
    if(s.t==='col'){
      // Two layers, not one. A dark plate at .8 so the honeycomb stops reading through the
      // column and the dots have something to sit on, then the column's own colour over it
      // at a whisper — enough to tell one from the next without turning the board into
      // seventeen coloured blocks.
      const box={x:(s.x+2).toFixed(1),y:(s.top-16).toFixed(1),
                 width:(s.w-4).toFixed(1),height:(s.base-s.top+34).toFixed(1),rx:9};
      gRing.appendChild(mk('rect',{...box,fill:cv('--void2'),'fill-opacity':.8}));
      gRing.appendChild(mk('rect',{...box,fill:s.col,'fill-opacity':.07}));
      gRing.appendChild(mk('line',{x1:(s.x+5).toFixed(1),y1:(s.base+15).toFixed(1),
        x2:(s.x+s.w-5).toFixed(1),y2:(s.base+15).toFixed(1),
        stroke:s.col,'stroke-opacity':.32,'stroke-width':.9}));
      const cx=s.x+s.w/2, ty=(s.headTop!==undefined?s.headTop:s.top)-28;
      // Estimating a heading's width from its character count kept being wrong — bold caps
      // run about 0.72 of the font size, not the 0.60 a mixed-case average suggests, so
      // ADVERTISING and HARDENING still collided after being "fitted". Measure the text
      // that was actually laid out and shrink it to its column. Below 4.6 units it stops
      // being readable, so it is dropped rather than printed as a smear — the colour band
      // and the count still identify the column, and the phase is on every node in it.
      const room=s.w-8;
      const fitText=(el,floorFrac)=>{
        const start=parseFloat(getComputedStyle(el).fontSize);
        const w=el.getComputedTextLength();
        if(w<=room) return true;
        const px=start*room/w;
        if(px<start*floorFrac){ el.remove(); return false; }   // too small to read: drop it
        el.style.fontSize=px.toFixed(2)+'px';
        return true;
      };
      const t=mk('text',{class:'collbl hd',x:cx.toFixed(1),y:ty.toFixed(1),
        fill:cv('--ink'),'fill-opacity':1});
      if(s.key){ t.dataset.g=s.key; t.setAttribute('tabindex','0');
                 t.setAttribute('role','button');
                 t.setAttribute('aria-label',s.title[0]+' — what this column is'); }
      t.textContent=s.title[0]; gRingTop.appendChild(t);
      /* Two lines before shrinking, for a heading with a space in it.

         "Front-end design" is seventeen characters and the narrowest a column ever gets is
         about fifty-five units. It could not shrink that far without going under the floor,
         so it was dropped — and a column with no name at all is exactly the thing the floor
         exists to prevent. Wrapping at the last space costs a line and keeps the word.

         SVG does not wrap, so it is two tspans at an explicit dy, and everything below the
         heading — the sub-line, the click target, the dodge box — moves down by that line. */
      let head2=0;
      if(!fitText(t,0.62) || t.getComputedTextLength()>room){
        const sp=s.title[0].lastIndexOf(' ');
        if(sp>0){
          t.style.fontSize=''; t.textContent='';
          const a=mk('tspan',{x:cx.toFixed(1),dy:'-0.42em'}); a.textContent=s.title[0].slice(0,sp);
          const b=mk('tspan',{x:cx.toFixed(1),dy:'1.05em'}); b.textContent=s.title[0].slice(sp+1);
          t.append(a,b);
          if(!t.parentNode) gRingTop.appendChild(t);
          head2=11;
          // still too wide split? then it genuinely does not fit and the old rule applies
          const wid=Math.max(a.getComputedTextLength(),b.getComputedTextLength());
          if(wid>room){ const px=parseFloat(getComputedStyle(t).fontSize)*room/wid;
            if(px<parseFloat(getComputedStyle(t).fontSize)*0.62) t.remove();
            else t.style.fontSize=px.toFixed(2)+'px'; }
        }
      }
      if(s.title[1]){
        const t2=mk('text',{class:'ringsub',x:cx.toFixed(1),y:(ty+12+head2).toFixed(1),
          fill:cv('--ink2'),'fill-opacity':.9});
        t2.textContent=s.title[1]; gRingTop.appendChild(t2); fitText(t2,0.64);
      }
      const c2=mk('text',{class:'ringcount',x:cx.toFixed(1),y:(s.base+31).toFixed(1),
        fill:s.col,'fill-opacity':.75});
      c2.textContent=s.n; gRingTop.appendChild(c2);
      ringBoxes.push({x0:s.x,x1:s.x+s.w,ty:ty-4,h:(s.title[1]?28:16)+head2});
      if(s.key){
        // SVG text is only clickable where a glyph is actually painted, so a press landing
        // in the gap between two letters — or on the second line, or just above the word —
        // hit nothing. A transparent rect over the whole heading block is the target, which
        // is also a hand-sized one rather than a 6px-tall strip of type.
        const hit=mk('rect',{class:'hdhit',x:(s.x+2).toFixed(1),y:(ty-11-head2*0.5).toFixed(1),
          width:(s.w-4).toFixed(1),height:((s.title[1]?26:15)+head2).toFixed(1),
          fill:'transparent',tabindex:'0',role:'button'});
        hit.setAttribute('aria-label',s.title[0]+' — what this column is');
        const open=e=>{ e.stopPropagation(); arm(); groupPanel(s.key); };
        hit.onclick=open;
        hit.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(e); } };
        hit.onpointerenter=()=>{ t.classList.add('hot'); };
        hit.onpointerleave=()=>{ t.classList.remove('hot'); };
        hit.onfocus=()=>t.classList.add('hot');
        hit.onblur=()=>t.classList.remove('hot');
        gRingTop.appendChild(hit);
        t.removeAttribute('tabindex'); t.removeAttribute('role');
      }
    } else if(s.t==='lane'){
      // A hairline behind each build step, and its name written along the bottom.
      //
      // The names used to be turned on their side, on the argument that horizontal ones
      // would need the width the streams are using. True of one row; not true of three.
      // Staggered across three rows, first-fit, they read as text rather than as a barcode,
      // and a tick above each one says which column it belongs to.
      gRing.appendChild(mk('line',{x1:s.x.toFixed(1),y1:s.top.toFixed(1),
        x2:s.x.toFixed(1),y2:s.bot.toFixed(1),
        stroke:s.col,'stroke-opacity':.20,'stroke-width':.7}));
      /* Turned on their side, under their own column, on one baseline. Laid flat they
         needed the width the streams are using — spread across the bottom of the strip they
         fitted, but they stopped being under the thing they name, which is the only reason
         a column label is a column label. Vertical costs height, and height is what this
         view has spare. */
      const ly=s.base;
      const t=mk('text',{class:'lanelbl',x:s.x.toFixed(1),y:ly.toFixed(1),
        fill:s.col,'text-anchor':'end',
        transform:`rotate(-90 ${s.x.toFixed(1)} ${ly.toFixed(1)})`});
      t.textContent=s.label; gRingTop.appendChild(t);
      if(s.key){
        // the hit target is a rect in the text's own rotated frame, sized from the glyphs
        // that were laid out — a name on its side is a six-unit strip of type

        const hit=mk('rect',{class:'hdhit',x:(s.x-len-4).toFixed(1),y:(ly-11).toFixed(1),
          width:(len+8).toFixed(1),height:15,rx:4,fill:'transparent',transform:tr});
        hit.setAttribute('aria-label',s.label+' — '+s.n+' skills, show them');
        pickable(hit,'g:'+s.key);
        hit.classList.toggle('pick',PICKS.has('g:'+s.key));
        previewable(hit,'g:'+s.key,[t]);
        gRingTop.appendChild(hit);
      }
    } else if(s.t==='hub'){
      const g=mk('g');
      g.appendChild(mk('circle',{cx:s.x.toFixed(1),cy:s.y.toFixed(1),r:(s.r*2.2).toFixed(1),
        fill:s.col,'fill-opacity':.11}));
      g.appendChild(mk('circle',{cx:s.x.toFixed(1),cy:s.y.toFixed(1),r:s.r.toFixed(1),
        fill:s.col}));
      // The count is the point of the view, so it is set large and in the stream's own
      // colour; the ring's name goes under it small, because by then the colour has said it.
      const c=mk('text',{class:'hubn',x:(s.x+s.r+7).toFixed(1),y:(s.y+2.4).toFixed(1),
        fill:s.col,'text-anchor':'start'});
      c.textContent=s.n; gRingTop.appendChild(g); gRingTop.appendChild(c);
      const l=mk('text',{class:'hublbl',x:(s.x+s.r+7).toFixed(1),y:(s.y+11).toFixed(1),
        fill:s.col,'fill-opacity':.72,'text-anchor':'start'});
      l.textContent=s.label; gRingTop.appendChild(l);
      ringBoxes.push({x0:s.x-s.r-4,x1:s.x+s.r+58,ty:s.y+4,h:14});
      /* The destination is the same switch as its chip in the key: click it and that ring's
         skills light up and are named. It reads as a total, so being able to ask "which
         nineteen?" of it is the obvious next question — and SVG text is only clickable on
         painted glyphs, so the target is a rect over the dot, the count and the name rather
         than the type itself. */
      const hit=mk('rect',{class:'hdhit',x:(s.x-s.r-6).toFixed(1),y:(s.y-9).toFixed(1),
        width:(s.r+6+9+62).toFixed(1),height:24,rx:5,fill:'transparent'});
      hit.setAttribute('aria-label',s.label+' — '+s.n+' skills, show them');
      pickable(hit,'r:'+s.key);
      hit.classList.toggle('pick',PICKS.has('r:'+s.key));
      previewable(hit,'r:'+s.key,[g,c,l]);
      gRingTop.appendChild(hit);
    }
  });
  // fresh elements, so the cached base sizes went with the old ones — and any preview was
  // pointing at an element that no longer exists
  hoverPick=null;
  scafZ=0; sizeScaffold();
}

function repaint(){
  N.forEach((n,i)=>{
    const c=paintOf(n), el=nodeEl[i];
    el.querySelector('.ring').setAttribute('fill',c);
    el.querySelectorAll('.dot').forEach(d=>{
