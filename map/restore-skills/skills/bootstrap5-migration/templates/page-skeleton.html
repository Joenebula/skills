<!doctype html>
<!--
  Page skeleton for a Bootstrap 5 migration.
  - Replace TITLE, the <main> content, and the shared partial markers.
  - Brand theming lives in assets/css/theme.css (loaded AFTER bootstrap).
  - Shared header/footer: include via build step, or inject from main.js, but keep
    a real <nav> and <main> in the HTML so core navigation works without JS.
  - Keep this structure identical across pages so chrome never drifts.
-->
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PAGE TITLE — Brand</title>
  <meta name="description" content="Concise, page-specific description.">

  <!-- Fonts: preconnect + swap to protect performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Bootstrap first, brand theme second (order matters) -->
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/theme.css">
</head>
<body>
  <!-- Skip link: first focusable element (WCAG 2.2 SC 2.4.1) -->
  <a class="visually-hidden-focusable skip-link" href="#main">Skip to main content</a>

  <!-- ===== SHARED HEADER / NAV (single source of truth) ===== -->
  <header>
    <nav class="navbar navbar-expand-lg" aria-label="Primary">
      <div class="container">
        <a class="navbar-brand" href="index.html">BRAND</a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#primary-nav"
                aria-controls="primary-nav" aria-expanded="false"
                aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="primary-nav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="shop.html">Shop</a></li>
            <!-- mark current page with aria-current="page" -->
          </ul>
          <div class="d-flex gap-2 align-items-center">
            <a class="btn btn-primary btn-sm" href="join.html">Join</a>
            <a class="nav-link p-2" href="cart.html" aria-label="Cart, 0 items">
              <!-- cart icon (SVG) --> <span class="cart-count" aria-hidden="true"></span>
            </a>
            <a class="nav-link p-2" href="account.html" aria-label="Account"><!-- icon --></a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <!-- ===== MAIN: one <main>, one <h1> ===== -->
  <main id="main" class="container py-5">
    <h1>PAGE HEADING</h1>
    <!-- page content; use the grid: row g-4 > col-12 col-md-… -->
  </main>

  <!-- ===== SHARED FOOTER ===== -->
  <footer class="border-top py-5 mt-5">
    <div class="container">
      <div class="row g-4">
        <div class="col-12 col-md-4"><!-- brand + responsibility notice --></div>
        <div class="col-6 col-md-2"><!-- shop links --></div>
        <div class="col-6 col-md-2"><!-- company links --></div>
        <div class="col-12 col-md-4"><!-- legal: privacy, terms, cookies --></div>
      </div>
      <p class="small text-secondary mt-4 mb-0">
        © <span id="year"></span> Brand Ltd. Please drink responsibly. 18+ only.
      </p>
    </div>
  </footer>

  <!-- Live region for toasts / cart announcements (WCAG 2.2 SC 4.1.3) -->
  <div aria-live="polite" class="visually-hidden" id="sr-announcer"></div>

  <!-- Bootstrap JS first (for components), then shared site JS -->
  <script src="assets/js/bootstrap.bundle.min.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
